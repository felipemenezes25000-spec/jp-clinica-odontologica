              ev(s, "pop");
              ev(s + 0.3, "conta", { dur: 0.5 });
              return s + 1.3;
            },
          };
        },
        /* ================================================================
           SEGUNDA LEVA DE ILUSTRAÇÕES — os temas que o calendário de
           set/out pediu e o motor ainda não sabia desenhar.

           Todas seguem o contrato das primeiras: quadro de 888 px, duas
           cores, traço redondo, e `anima` devolvendo o instante em que a
           cena pode ser cortada. Nenhuma inventa aparelho, nenhuma escreve
           marca, nenhuma mostra sangue — é o §"segurança clínica" virando
           regra de desenho.

           A SILHUETA É O QUE FAZ LER. A primeira versão do dente saiu com a
           passagem coroa→raiz suave demais e, na folha de contato, lia como
           semente. O colo estrangulado abaixo da coroa é o detalhe que faz
           o olho reconhecer um dente antes de ler a legenda.
           ================================================================ */

        /* O dente em corte: esmalte, dentina, câmara pulpar e canal.
           modo "canal" — a polpa inflama, o canal é limpo e selado;
           modo "sensibilidade" — o frio toca a coroa e o estímulo desce. */
        dente: (o) => {
          const fora =
            "M 300 196 C 288 130, 296 68, 332 42 C 372 14, 516 14, 556 42 C 592 68, 600 130, 588 196 C 580 246, 560 280, 534 294 C 524 374, 504 452, 478 500 C 466 520, 422 520, 410 500 C 384 452, 364 374, 354 294 C 328 280, 308 246, 300 196 Z";
          const dentina =
            "M 324 194 C 314 136, 322 84, 350 62 C 384 38, 504 38, 538 62 C 566 84, 574 136, 564 194 C 556 240, 540 270, 518 284 C 508 364, 490 440, 468 486 C 458 504, 430 504, 420 486 C 398 440, 380 364, 370 284 C 348 270, 332 240, 324 194 Z";
          const polpa =
            "M 396 116 C 396 84, 492 84, 492 116 L 480 244 C 474 280, 464 330, 458 416 C 454 462, 434 462, 430 416 C 424 330, 414 280, 408 244 Z";
          const frio = o.modo === "sensibilidade";
          /* Os túbulos: os caminhos que ligam a superfície à polpa. São o
             motivo de o frio ser sentido lá dentro, e desenhá-los é o que
             tira a explicação do abstrato. */
          const tubulos = [];
          for (let k = 0; k < 7; k += 1) {
            const x = 348 + k * 32;
            tubulos.push(
              `<path class="tub" pathLength="1" d="M ${String(x)} ${String(66 + Math.abs(k - 3) * 9)} L ${String(414 + k * 10)} ${String(168 + Math.abs(k - 3) * 8)}" style="fill:none;stroke:var(--gl);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1"/>`,
            );
          }
          return {
            h: 540,
            svg: `<svg viewBox="0 0 888 540">
              <path class="fs esmalte-f" d="${fora}" style="opacity:0"/>
              <path class="dentina" d="${dentina}" style="fill:#E3D19C;opacity:0"/>
              <path class="polpa" d="${polpa}" style="fill:rgba(214,146,136,.72);opacity:0"/>
              ${frio ? `<g class="tubs" style="opacity:0">${tubulos.join("")}</g>` : ""}
              ${frio ? "" : `<path class="selo" pathLength="1" d="M 444 132 L 444 452" style="fill:none;stroke:var(--gl);stroke-width:17;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0"/>`}
              ${frio ? "" : `<g class="lima" style="opacity:0"><path d="M 444 60 L 444 250" style="fill:none;stroke:var(--gs);stroke-width:7;stroke-linecap:round"/><circle cx="444" cy="54" r="13" style="fill:var(--gs)"/></g>`}
              <path class="t d contorno" pathLength="1" d="${fora}" style="stroke-width:5.5"/>
              ${frio ? `<g class="gota" style="opacity:0"><path d="M 726 84 C 726 54, 762 34, 762 6 C 762 34, 798 54, 798 84 C 798 110, 726 110, 726 84 Z" style="fill:rgba(162,214,244,.85);stroke:var(--gl);stroke-width:4"/></g>` : ""}
              <ellipse class="aviso centro" cx="444" cy="230" rx="160" ry="196" style="fill:none;stroke:var(--gl);stroke-width:4;opacity:0"/>
            </svg>`,
            anima(raiz, add, s, ev) {
              const contorno = raiz.querySelector(".contorno");
              const esm = raiz.querySelector(".esmalte-f");
              const dent = raiz.querySelector(".dentina");
              const pol = raiz.querySelector(".polpa");
              const aviso = raiz.querySelector(".aviso");
              const tubs = raiz.querySelector(".tubs");
              const gota = raiz.querySelector(".gota");
              const lima = raiz.querySelector(".lima");
              const selo = raiz.querySelector(".selo");
              const calma = [214, 146, 136];
              const irritada = [204, 84, 70];
              add((l) => {
                risca(contorno, inOutCubic(faixa(l, s, 0.85)));
                esm.style.opacity = String(0.22 * outCubic(faixa(l, s + 0.4, 0.4)));
                dent.style.opacity = String(0.95 * outCubic(faixa(l, s + 0.5, 0.45)));
                pol.style.opacity = String(outCubic(faixa(l, s + 0.8, 0.4)));
              });
              if (frio) {
                /* O frio CAI, o túbulo acende, a polpa responde. A ordem é a
                   explicação: é ela que mostra por que um estímulo de fora
                   vira sensação lá dentro. */
                add((l) => {
                  const pg = faixa(l, s + 1.05, 0.55);
                  gota.style.opacity = String(pg > 0 && pg < 1 ? 1 : 0);
                  gota.style.transform = `translate(${String(-266 * outCubic(pg))}px, ${String(52 * outCubic(pg))}px)`;
                  tubs.style.opacity = String(outCubic(faixa(l, s + 1.5, 0.35)));
                  [...tubs.children].forEach((tb, k) =>
                    risca(tb, outCubic(faixa(l, s + 1.55 + k * 0.07, 0.4))),
                  );
                  const pulso = faixa(l, s + 2.15, 0.9);
                  pol.style.fill = rgb(mix(calma, irritada, Math.sin(Math.PI * pulso)));
                  aviso.style.opacity = String(pulso > 0 && pulso < 1 ? 0.55 * (1 - pulso) : 0);
                  aviso.style.transform = `scale(${String(0.84 + 0.32 * outCubic(pulso))})`;
                });
                ev(s, "risco");
                ev(s + 1.5, "pop");
                ev(s + 2.2, "tick");
                return s + 3.2;
              }
              /* Canal: a polpa inflamada acalma DEPOIS do tratamento. Em
                 nenhum quadro há promessa de "não dói" — o que a imagem diz
                 é que a origem da dor é o que se trata. */
              add((l) => {
                const inf = faixa(l, s + 1.0, 0.7);
                pol.style.fill = rgb(mix(calma, irritada, outCubic(inf)));
                const pa = faixa(l, s + 1.1, 0.85);
                aviso.style.opacity = String(pa > 0 && pa < 1 ? 0.6 * (1 - pa) : 0);
                aviso.style.transform = `scale(${String(0.82 + 0.34 * outCubic(pa))})`;
                const pl2 = faixa(l, s + 2.05, 0.85);
                lima.style.opacity = String(pl2 > 0 && pl2 < 1 ? 1 : 0);
                lima.style.transform = `translateY(${String(196 * inOutCubic(pl2))}px)`;
                const ps = outCubic(faixa(l, s + 3.0, 0.75));
                selo.style.opacity = String(ps);
                risca(selo, ps);
                pol.style.opacity = String((1 - 0.7 * ps) * outCubic(faixa(l, s + 0.8, 0.4)));
              });
              ev(s, "risco");
              ev(s + 1.15, "tick");
              ev(s + 2.05, "sopro");
              ev(s + 3.05, "encaixe");
              return s + 3.95;
            },
          };
        },

        /* A margem da gengiva no colo do dente.
           modo "retracao" — a margem desce e expõe a raiz, com a medida;
           modo "inflamacao" — o biofilme se acumula e a margem reage. */
        gengiva: (o) => {
          const coroaC =
            "M 372 268 C 362 206, 356 134, 380 100 C 404 68, 484 68, 508 100 C 532 134, 526 206, 516 268 Z";
          const raizC =
            "M 372 268 C 380 346, 400 426, 430 476 C 438 490, 452 490, 460 476 C 488 426, 508 346, 516 268 Z";
          const linhaG =
            "M 40 276 C 140 262, 250 258, 330 266 C 372 270, 396 282, 444 282 C 492 282, 516 270, 558 266 C 638 258, 748 262, 848 276";
          const inflam = o.modo === "inflamacao";
          /* O biofilme fica ACIMA do preenchimento da gengiva na ordem de
             desenho. Na primeira versão ele nascia por baixo e sumia — o
             acúmulo que a cena inteira existe para mostrar era invisível. */
          const placa = [];
          if (inflam) {
            const rnd = semeado(7);
            for (let k = 0; k < 22; k += 1) {
              const x = 344 + rnd() * 200;
              const y = 250 + rnd() * 30;
              placa.push(
                `<circle class="biof" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(6.5 + rnd() * 4).toFixed(1)}" style="fill:#D8B24E;opacity:0"/>`,
              );
            }
          }
          const ev = esvaecer(520);
          return {
            h: 520,
            svg: `<svg viewBox="0 0 888 520">${ev.abre}
              <path class="ft raiz-c" d="${raizC}" style="opacity:0"/>
              <path class="t2 d raiz-l" pathLength="1" d="${raizC}"/>
              <g class="gum">
                <path class="fg" d="${linhaG} L 848 560 L 40 560 Z"/>
                <path class="t d linhag" pathLength="1" d="${linhaG}"/>
              </g>
              <path class="fs" d="${coroaC}"/>
              <path class="t d coroa-l" pathLength="1" d="${coroaC}"/>
              ${inflam ? `<g class="placa">${placa.join("")}</g>` : ""}
              ${inflam ? "" : `<g class="medida" style="opacity:0"><path class="tr" d="M 596 282 L 596 340"/><path class="t2" d="M 578 282 L 614 282"/><path class="t2" d="M 578 340 L 614 340"/><text class="tx" x="632" y="320">RAIZ EXPOSTA</text></g>`}
            ${ev.fecha}</svg>`,
            anima(raiz, add, s, ev) {
              const gum = raiz.querySelector(".gum");
              const linhag = raiz.querySelector(".linhag");
              const coroaL = raiz.querySelector(".coroa-l");
              const raizL = raiz.querySelector(".raiz-l");
              const raizF = raiz.querySelector(".raiz-c");
              const medida = raiz.querySelector(".medida");
              const placa = raiz.querySelector(".placa");
              add((l) => {
                risca(coroaL, outCubic(faixa(l, s, 0.6)));
                risca(linhag, outCubic(faixa(l, s + 0.2, 0.7)));
                risca(raizL, outCubic(faixa(l, s + 0.45, 0.6)));
                raizF.style.opacity = String(0.85 * outCubic(faixa(l, s + 0.7, 0.4)));
              });
              if (placa) {
                add((l) => {
                  [...placa.children].forEach((b, k) => {
                    b.style.opacity = String(0.92 * outCubic(faixa(l, s + 1.1 + k * 0.04, 0.3)));
                  });
                  // a margem reage ao acúmulo: engrossa um pouco. Não sangra
                  // na tela — sangramento desenhado afasta mais do que informa
                  const pr = outCubic(faixa(l, s + 2.1, 0.8));
                  linhag.style.strokeWidth = String(4.5 + 5 * pr);
                  gum.style.transform = `translateY(${String(-6 * pr)}px)`;
                });
                ev(s, "risco");
                ev(s + 1.15, "sopro");
                ev(s + 2.15, "tick");
                return s + 3.2;
              }
              /* A RETRAÇÃO É O MOVIMENTO. A margem desce e a raiz aparece —
                 é como mostrar "a gengiva mudou de posição" sem recorrer a
                 antes/depois de foto, que aqui seria promessa de resultado. */
              add((l) => {
                const pd = inOutCubic(faixa(l, s + 1.3, 1.1));
                gum.style.transform = `translateY(${String(58 * pd)}px)`;
                medida.style.opacity = String(outCubic(faixa(l, s + 2.5, 0.5)));
              });
              ev(s, "risco");
              ev(s + 1.35, "sopro");
              ev(s + 2.55, "tick");
              return s + 3.4;
            },
          };
        },
        /* O siso visto como num exame panorâmico: três molares na fileira.
           modo "inclinado" — o último nasce deitado contra o vizinho. */
        siso: (o) => {
          const inclinado = o.modo === "inclinado";
          /* Um molar: coroa larga e duas raízes. Desenhado na origem para o
             grupo inteiro poder girar — é a inclinação que conta a história. */
          const molar = (x, id) => `
            <g class="molar ${id}" style="transform-box:fill-box;transform-origin:50% 8%">
              <path class="fs" d="M ${String(x - 74)} 250 C ${String(x - 82)} 180, ${String(x - 76)} 126, ${String(x - 48)} 110 C ${String(x - 14)} 92, ${String(x + 14)} 92, ${String(x + 48)} 110 C ${String(x + 76)} 126, ${String(x + 82)} 180, ${String(x + 74)} 250 Z"/>
              <path class="ft" d="M ${String(x - 62)} 250 C ${String(x - 58)} 330, ${String(x - 46)} 388, ${String(x - 34)} 418 C ${String(x - 28)} 432, ${String(x - 14)} 432, ${String(x - 8)} 418 C ${String(x - 2)} 388, ${String(x - 6)} 330, ${String(x - 12)} 250 Z"/>
              <path class="ft" d="M ${String(x + 62)} 250 C ${String(x + 58)} 330, ${String(x + 46)} 388, ${String(x + 34)} 418 C ${String(x + 28)} 432, ${String(x + 14)} 432, ${String(x + 8)} 418 C ${String(x + 2)} 388, ${String(x + 6)} 330, ${String(x + 12)} 250 Z"/>
              <path class="t d borda" pathLength="1" d="M ${String(x - 74)} 250 C ${String(x - 82)} 180, ${String(x - 76)} 126, ${String(x - 48)} 110 C ${String(x - 14)} 92, ${String(x + 14)} 92, ${String(x + 48)} 110 C ${String(x + 76)} 126, ${String(x + 82)} 180, ${String(x + 74)} 250"/>
            </g>`;
          const ev = esvaecer(520);
          return {
            h: 520,
            svg: `<svg viewBox="0 0 888 520">${ev.abre}
              <path class="f" d="M 40 250 L 848 250 L 848 560 L 40 560 Z" style="opacity:.5"/>
              <path class="t2 d osso-l" pathLength="1" d="M 40 250 L 848 250"/>
              ${molar(214, "m1")}
              ${molar(410, "m2")}
              ${molar(626, "m3")}
              <g class="pressao" style="opacity:0">
                <path class="tr" d="M 566 172 L 494 172"/>
                <path class="t2" d="M 508 160 L 492 172 L 508 184"/>
              </g>
              ${rotulo(626, 96, 470, 54, inclinado ? "siso deitado" : "siso em pé", "esq")}
            ${ev.fecha}</svg>`,
            anima(raiz, add, s, ev) {
              const ossoL = raiz.querySelector(".osso-l");
              const molares = [...raiz.querySelectorAll(".molar")];
              const m3 = raiz.querySelector(".m3");
              const pressao = raiz.querySelector(".pressao");
              const rot = raiz.querySelector(".rot");
              add((l) => {
                risca(ossoL, outCubic(faixa(l, s, 0.6)));
                molares.forEach((m, k) => {
                  const p = outCubic(faixa(l, s + 0.3 + k * 0.22, 0.5));
                  m.style.opacity = String(p);
                  m.style.transform = `translateY(${String(26 * (1 - p))}px)`;
                  risca(m.querySelector(".borda"), p);
                });
              });
              if (inclinado) {
                /* O GIRO É O ARGUMENTO. "Depende da posição" vira visível no
                   instante em que o terceiro molar deita contra o vizinho. */
                add((l) => {
                  const pg = inOutCubic(faixa(l, s + 1.45, 0.9));
                  m3.style.transform = `translateY(0px) rotate(${String(-34 * pg)}deg)`;
                  const pp = faixa(l, s + 2.3, 0.8);
                  pressao.style.opacity = String(pp > 0 && pp < 1 ? Math.sin(Math.PI * pp) : 0);
                });
                ev(s, "risco");
                ev(s + 1.5, "sopro");
                ev(s + 2.35, "tick");
                animaRotulo(rot, add, s + 2.6);
                return s + 3.5;
              }
              animaRotulo(rot, add, s + 1.6);
              ev(s, "risco");
              ev(s + 1.65, "tick");
              return s + 2.6;
            },
          };
        },
        /* A arcada vista de cima, dente a dente, sobre a curva do arco.
           modo "falta" — um espaço vazio e os vizinhos pendendo para ele;
           modo "varios" — vários espaços, o caso do Reel 06.

           O QUE DENUNCIOU A PRIMEIRA VERSÃO: ela desenhava catorze elipses
           iguais e o resultado, no vídeo, lia como colar de pérolas. Nenhum
           dente real é redondo visto de cima, e nenhuma arcada tem catorze
           dentes do mesmo tamanho.

           Três coisas consertam isso, e nenhuma é enfeite:

             FORMA POR POSIÇÃO ... incisivo é estreito e reto na borda, canino
                                   é mais alto, pré-molar é quadrado, molar é
                                   largo. É a variação que faz o olho ler
                                   "arcada" em vez de "fileira de bolinhas".
             SULCO ............... a linha da face de mastigação. Vista de
                                   cima, é ela que distingue um dente de um
                                   seixo — e só existe no pré-molar e no
                                   molar, que são os que mastigam.
             GENGIVA ATRÁS ....... uma faixa espessa sob os dentes. Sem ela os
                                   dentes flutuam no verde; com ela o vão do
                                   dente que falta vira ALVÉOLO, que é o que
                                   ele é, em vez de uma bolha tracejada
                                   boiando no fundo. */
        arcada: (o) => {
          const n = 14;
          const faltam = o.modo === "varios" ? [3, 4, 8, 10] : [7];
          /* Do centro para o fundo: dois incisivos, um canino, dois
             pré-molares, dois molares — de cada lado. */
          /* ARCO PRÓPRIO, não o `noArco` global. O global é do `protocolo`,
             que divide o quadro com texto e por isso desenha pequeno; aqui a
             arcada É a cena, e no primeiro render ela ficou ocupando pouco
             mais da metade da largura, com um terço da altura vazio embaixo. */
          const A = 352;
          const Y0 = 52;
          const PROF = 428;
          const TM = 1.745;
          const noArcoAqui = (th) => [
            444 + A * Math.sin(th),
            Y0 + (PROF * (1 - Math.cos(th))) / (1 - Math.cos(TM)),
          ];
          const feitios = Array.from({ length: n }, (_, k) =>
            feitioDente(k < n / 2 ? n / 2 - 1 - k : k - n / 2),
          );
          const postos = distribuirNoArco(feitios, noArcoAqui, 1.45);
          const dentes = [];
          for (let k = 0; k < n; k += 1) {
            const { x, y, f, graus: rot } = postos[k];
            const vazio = faltam.includes(k);
            dentes.push(
              `<g class="dente ${vazio ? "vazio" : "cheio"}" data-k="${String(k)}" style="transform-box:fill-box;transform-origin:50% 50%">${svgDenteArco(x, y, rot, f, vazio)}</g>`,
            );
          }
          const curva = linhaDe(arcoPontos(A, Y0, PROF, 60));
          return {
            h: 440,
            svg: `<svg viewBox="0 0 888 440">
              <path class="gengiva-arco" d="${curva}" style="fill:none;stroke:var(--gg);stroke-width:88;stroke-linecap:round;opacity:0"/>
              <path class="t3 d arco-l" pathLength="1" d="${curva}" style="stroke-width:3"/>
              ${dentes.join("")}
            </svg>`,
            anima(raiz, add, s, ev) {
              const gengiva = raiz.querySelector(".gengiva-arco");
              const arcoL = raiz.querySelector(".arco-l");
              const todos = [...raiz.querySelectorAll(".dente")];
              const cheios = todos.filter((d) => d.classList.contains("cheio"));
              const vazios = todos.filter((d) => d.classList.contains("vazio"));
              // os vizinhos do vão: são eles que pendem, e é isso que a
              // narração chama de "mudança na posição dos dentes vizinhos"
              const vizinhos = todos.filter((d) => {
                const k = Number(d.dataset.k);
                return (
                  d.classList.contains("cheio") &&
                  vazios.some((v) => Math.abs(Number(v.dataset.k) - k) === 1)
                );
              });
              add((l) => {
                risca(arcoL, outCubic(faixa(l, s, 0.8)));
                gengiva.style.opacity = String(0.85 * outCubic(faixa(l, s + 0.2, 0.5)));
                cheios.forEach((d, k) => {
                  const p = outCubic(faixa(l, s + 0.3 + k * 0.055, 0.4));
                  d.style.opacity = String(p);
                  d.style.transform = `scale(${String(0.62 + 0.38 * p)})`;
                });
                // o alvéolo vazio aparece DEPOIS de a arcada estar inteira:
                // é a ausência que precisa ser notada, e ausência só se nota
                // contra o que estava lá
                const pv = outCubic(faixa(l, s + 1.5, 0.5));
                vazios.forEach((d) => (d.style.opacity = String(pv)));
                const pi = inOutCubic(faixa(l, s + 2.1, 0.8));
                vizinhos.forEach((d, k) => {
                  d.style.transform = `scale(1) rotate(${String((k % 2 ? 1 : -1) * 9 * pi)}deg)`;
                });
              });
              ev(s, "risco");
              ev(s + 1.55, "tick");
              ev(s + 2.15, "sopro");
              return s + 3.1;
            },
          };
        },
        /* Aparelho fixo à esquerda, alinhador transparente à direita. A
           comparação inteira num quadro — é o que o Reel 04 precisa dizer
           antes de explicar que a escolha não é de vitrine.

           ESCALA. A primeira versão desenhava cinco dentes de 54 px por lado
           num quadro de 1080: no vídeo pronto a comparação virava um detalhe
           no alto da tela, enquanto o dente em corte do Reel 05 preenchia.
           Quatro dentes maiores dizem a mesma coisa e sustentam o quadro —
           num Reel, o que não se lê de relance não foi dito. */
        orto: () => {
          /* UM INCISIVO VISTO DE FRENTE, e não um dedo.
             A primeira versão arredondava o ALTO e deixava a base reta — o
             contrário do dente. Onde o dente encontra a gengiva ele é largo e
             quase quadrado; quem arredonda é a borda de baixo, a que morde.
             Invertido, o desenho lia como fileira de dedos, que foi
             exatamente o que se viu no vídeo pronto. */
          const dentinho = (x, y, w, h) =>
            `M ${String(x - w)} ${String(y - h)} L ${String(x + w)} ${String(y - h)} ` +
            `L ${String(x + w)} ${String(y - h * 0.3)} ` +
            `C ${String(x + w)} ${String(y - h * 0.06)}, ${String(x + w * 0.62)} ${String(y)}, ${String(x + w * 0.34)} ${String(y)} ` +
            `L ${String(x - w * 0.34)} ${String(y)} ` +
            `C ${String(x - w * 0.62)} ${String(y)}, ${String(x - w)} ${String(y - h * 0.06)}, ${String(x - w)} ${String(y - h * 0.3)} Z`;
          const POS = [-1.5, -0.5, 0.5, 1.5];
          const fila = (cx) =>
            POS.map(

            ).join("");
          return {
            h: 560,
            svg: `<svg viewBox="0 0 888 560">
              <path class="t3" d="M 444 40 L 444 470" style="stroke-dasharray:10 14"/>
              <g class="lado-a">
                <path class="fg" d="M 24 236 C 90 206, 356 206, 420 236 L 420 150 L 24 150 Z"/>
                <path class="t2" d="M 24 236 C 90 206, 356 206, 420 236"/>

                <text class="tx" x="222" y="504" text-anchor="middle">APARELHO FIXO</text>
              </g>
              <g class="lado-b">
                <path class="fg" d="M 468 236 C 534 206, 800 206, 864 236 L 864 150 L 468 150 Z"/>
                <path class="t2" d="M 468 236 C 534 206, 800 206, 864 236"/>
                ${fila(666)}
                <path class="alin" d="M 466 236 C 466 212, 510 198, 666 198 C 822 198, 866 212, 866 236 L 866 398 C 866 422, 822 436, 666 436 C 510 436, 466 422, 466 398 Z" style="fill:rgba(246,250,242,.22);stroke:var(--gl);stroke-width:5;stroke-linejoin:round;opacity:0"/>
                <text class="tx" x="666" y="504" text-anchor="middle">ALINHADOR</text>
              </g>
            </svg>`,
            anima(raiz, add, s, ev) {
              const ladoA = raiz.querySelector(".lado-a");
              const ladoB = raiz.querySelector(".lado-b");
              const fio = raiz.querySelector(".fio");
              const braq = [...raiz.querySelectorAll(".braq")];
              const alin = raiz.querySelector(".alin");
              add((l) => {
                const pa = outCubic(faixa(l, s, 0.5));
                ladoA.style.opacity = String(pa);
                ladoA.style.transform = `translateX(${String(-34 * (1 - pa))}px)`;
                braq.forEach((b, k) => {
                  b.style.opacity = String(outCubic(faixa(l, s + 0.45 + k * 0.09, 0.3)));
                });
                risca(fio, outCubic(faixa(l, s + 0.9, 0.55)));
                const pb = outCubic(faixa(l, s + 1.35, 0.5));
                ladoB.style.opacity = String(pb);
                ladoB.style.transform = `translateX(${String(34 * (1 - pb))}px)`;
                // o alinhador ASSENTA por cima: desce e encaixa
                const pe = outBack(faixa(l, s + 1.8, 0.6));
                alin.style.opacity = String(c01(faixa(l, s + 1.8, 0.25) * 2));
                alin.style.transform = `translateY(${String(-60 * (1 - pe))}px)`;
              });
              ev(s + 0.5, "sopro");
              ev(s + 1.4, "sopro");
              ev(s + 2.1, "encaixe");
              return s + 2.9;
            },
          };
        },
        /* A escala de cor.
           modo "escala" — a régua de tons e o cursor andando (Reel 05);
           modo "origens" — três dentes IGUAIS de tom e DIFERENTES de causa,
           que é a coisa inteira que o Reel 17 precisa dizer. */
        cor: (o) => {
          const origens = o.modo === "origens";
          const tons = ["#B9A268", "#C6B27C", "#D2C093", "#DCCDA8", "#E5DABC", "#EDE5D0"];
          if (!origens) {
            return {
              h: 430,
              svg: `<svg viewBox="0 0 888 430">
                ${tons
                  .map(
                    (t, k) =>
                      `<g class="amostra" style="opacity:0"><rect x="${String(96 + k * 118)}" y="120" width="96" height="180" rx="18" style="fill:${t}"/><rect class="t3" x="${String(96 + k * 118)}" y="120" width="96" height="180" rx="18"/></g>`,
                  )
                  .join("")}
                <g class="cursor" style="opacity:0"><path class="t" d="M 144 92 L 144 108"/><path class="t" d="M 128 92 L 160 92"/></g>
                <text class="tx" x="444" y="374" text-anchor="middle">ESCALA DE COR</text>
              </svg>`,
              anima(raiz, add, s, ev) {
                const amostras = [...raiz.querySelectorAll(".amostra")];
                const cursor = raiz.querySelector(".cursor");
                const txt = raiz.querySelector("text");
                add((l) => {
                  amostras.forEach((a, k) => {

                    a.style.opacity = String(p);
                    a.style.transform = `translateY(${String(20 * (1 - p))}px)`;
                  });
                  const pc = faixa(l, s + 0.9, 1.3);
                  cursor.style.opacity = String(pc > 0 ? 1 : 0);
                  cursor.style.transform = `translateX(${String(590 * inOutCubic(pc))}px)`;
                  txt.style.opacity = String(outCubic(faixa(l, s + 1.9, 0.5)));

                ev(s, "sopro");

          }
          /* Três dentes do MESMO tom, três motivos diferentes. A imagem que
             desmonta "todo dente escuro clareia" sem precisar de texto. */
          /* Um incisivo de frente — quadrado no colo, arredondado na borda
             que morde. A versão anterior era uma amêndoa, e amêndoa em fila
             de três lê como semente, não como dente. */
          const dentinho = (cx) =>
            `M ${String(cx - 66)} 70 C ${String(cx - 66)} 56, ${String(cx - 52)} 50, ${String(cx - 34)} 50 ` +
            `L ${String(cx + 34)} 50 C ${String(cx + 52)} 50, ${String(cx + 66)} 56, ${String(cx + 66)} 70 ` +
            `L ${String(cx + 62)} 268 C ${String(cx + 58)} 340, ${String(cx + 34)} 392, ${String(cx)} 392 ` +
            `C ${String(cx - 34)} 392, ${String(cx - 58)} 340, ${String(cx - 62)} 268 Z`;
          const eixos = [
            { cx: 180, rot: "PIGMENTO\nEXTERNO" },

          return {

                    ${k === 1 ? `<path d="M ${String(ei.cx - 30)} 150 C ${String(ei.cx - 20)} 120, ${String(ei.cx + 20)} 120, ${String(ei.cx + 30)} 150 C ${String(ei.cx + 24)} 196, ${String(ei.cx - 24)} 196, ${String(ei.cx - 30)} 150 Z" style="fill:var(--gl2)"/>` : ""}
                    ${k === 2 ? `<ellipse class="centro" cx="${String(ei.cx)}" cy="196" rx="34" ry="62" style="fill:rgba(120,92,60,.55)"/>` : ""}
                    ${k === 0 ? `<path class="t2" d="M ${String(ei.cx - 44)} 96 C ${String(ei.cx - 10)} 86, ${String(ei.cx + 18)} 88, ${String(ei.cx + 44)} 98"/>` : ""}
                    ${ei.rot
                      .split("\n")
                      .map(
                        (linha, j) =>
                          `<text class="tx" x="${String(ei.cx)}" y="${String(446 + j * 34)}" text-anchor="middle">${e(linha)}</text>`,

                      .join("")}

            anima(raiz, add, s, ev) {
              const casos = [...raiz.querySelectorAll(".caso")];
              add((l) => {
                casos.forEach((cs, k) => {
                  const p = outCubic(faixa(l, s + k * 0.42, 0.55));

                  risca(cs.querySelector(".borda"), p);

              ev(s, "sopro");
              ev(s + 0.45, "sopro");

        },

        /* A saliva protegendo o dente — e o que muda quando ela diminui.
           modo "seca": o escudo afina e o ácido encosta no esmalte.

           A primeira versão desenhava a gota só de contorno, em 3 px, e na
           folha de contato não havia saliva nenhuma na tela. Gota é volume:
           tem de ser preenchida para existir a 1080 px de largura. */
        saliva: (o) => {
          const seca = o.modo === "seca";
          const rnd = semeado(23);
          const gotas = [];
          for (let k = 0; k < 11; k += 1) {
            const x = 150 + rnd() * 590;
            const y = 84 + rnd() * 74;
            const r = 15 + rnd() * 9;
            gotas.push(
              `<path class="gota" data-k="${String(k)}" d="M ${String(x - r)} ${String(y)} C ${String(x - r)} ${String(y - r * 0.9)}, ${String(x)} ${String(y - r * 1.5)}, ${String(x)} ${String(y - r * 2.4)} C ${String(x)} ${String(y - r * 1.5)}, ${String(x + r)} ${String(y - r * 0.9)}, ${String(x + r)} ${String(y)} C ${String(x + r)} ${String(y + r * 1.1)}, ${String(x - r)} ${String(y + r * 1.1)}, ${String(x - r)} ${String(y)} Z" style="fill:rgba(162,214,244,.8);stroke:var(--gl);stroke-width:3;opacity:0"/>`,
            );

          /* DENTE DE CABEÇA PARA BAIXO. A primeira versão desenhava a fileira
             arredondada EM CIMA — onde o dente encontra a gengiva — e reta
             embaixo, na borda que morde. É o inverso do dente, e com a
             gengiva logo acima o erro ficava à mostra.

             O passo também mudou: 118 px entre dentes de 88 deixava 30 px de
             vão, e dente que não encosta no vizinho não é arcada. */
          const PASSO_S = 94;
          const fileira = [-2, -1, 0, 1, 2]
            .map((k) => {

              return `<path class="fs" d="M ${String(cx - 44)} 312 L ${String(cx + 44)} 312 L ${String(cx + 44)} 384 C ${String(cx + 44)} 410, ${String(cx + 26)} 424, ${String(cx)} 424 C ${String(cx - 26)} 424, ${String(cx - 44)} 410, ${String(cx - 44)} 384 Z"/>`;

          const gengivaS = `<path class="fg" d="M 96 300 C 240 276, 648 276, 792 300 L 792 240 L 96 240 Z"/><path class="t2" d="M 96 300 C 240 276, 648 276, 792 300"/>`;
          return {
            h: 470,
            svg: `<svg viewBox="0 0 888 470">

              ${fileira}
              <g class="acido" style="opacity:0">
                ${[236, 444, 652]
                  .map(
                    (x) =>
                      `<path d="M ${String(x)} 150 L ${String(x)} 246" style="fill:none;stroke:#C98A3C;stroke-width:7;stroke-linecap:round"/><path d="M ${String(x - 16)} 226 L ${String(x)} 250 L ${String(x + 16)} 226" style="fill:none;stroke:#C98A3C;stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/>`,
                  )
                  .join("")}
              </g>
            </svg>`,
            anima(raiz, add, s, ev) {
              const gotas = [...raiz.querySelectorAll(".gota")];
              const escudo = raiz.querySelector(".escudo");
              const acido = raiz.querySelector(".acido");
              add((l) => {
                gotas.forEach((g, k) => {
                  const p = outCubic(faixa(l, s + k * 0.06, 0.4));
                  // na boca seca, só as três primeiras gotas ficam: a falta
                  // é o conteúdo, então ela precisa ser VISÍVEL como falta
                  g.style.opacity = String(seca && k >= 3 ? 0 : p);
                  g.style.transform = `translateY(${String(22 * (1 - p))}px)`;
                });

              ev(s + 0.9, "encaixe");

        },

        /* Biofilme → cálculo → remoção profissional. A sequência é o

        tartaro: () => {

          const coroa = (cx, esc = 1) =>

          const coroaC = coroa(444);
          const vizinhos = `<path class="fs viz" d="${coroa(288, 0.92)}" style="opacity:0"/><path class="t3 viz" d="${coroa(288, 0.92)}" style="opacity:0"/><path class="fs viz" d="${coroa(600, 0.92)}" style="opacity:0"/><path class="t3 viz" d="${coroa(600, 0.92)}" style="opacity:0"/>`;
          const ev = esvaecer(500);
          return {
            h: 500,
            svg: `<svg viewBox="0 0 888 500">${ev.abre}
              <path class="fg" d="M 40 300 C 160 286, 300 282, 372 292 C 404 296, 420 300, 444 300 C 468 300, 484 296, 516 292 C 588 282, 728 286, 848 300 L 848 540 L 40 540 Z"/>
              <path class="t d gengiva-l" pathLength="1" d="M 40 300 C 160 286, 300 282, 372 292 C 404 296, 420 300, 444 300 C 468 300, 484 296, 516 292 C 588 282, 728 286, 848 300"/>
              ${vizinhos}
              <path class="fs" d="${coroaC}"/>
              <path class="t d coroa-l" pathLength="1" d="${coroaC}"/>
              <g class="placa">${bolhas.join("")}</g>
              <path class="calculo" d="M 366 296 C 392 270, 424 264, 444 264 C 464 264, 496 270, 522 296 C 496 306, 392 306, 366 296 Z" style="fill:#C2A96A;opacity:0"/>
              <g class="ponta" style="opacity:0">

        /* Uma lesão pequena na mucosa e o tempo passando.

        lesao: () => {

        bruxismo: () => {

          const N = 4;

            anima(raiz, add, s, ev) {

                   que isto vira tremedeira de desenho animado. */
                const ap = faixa(l, s + 1.1, 2.3);

                db.style.opacity = String(pd * 0.9);

              ev(s, "sopro");
