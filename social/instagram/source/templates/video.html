      /** Separa a headline em linhas → palavras → segmentos (chave ou não).
       *  O estado de chave atravessa espaço e quebra de linha, então
       *  "[[anestesia\nlocal]]" acende as duas palavras. */
      /* ================================================================
         LEGENDA QUE OBEDECE À VOZ.

         O sintetizador devolve o instante de CADA palavra. Estas duas funções
         casam a palavra que está na TELA com a palavra que a voz DIZ, na
         ordem, e entregam o instante de cada uma.

         É a diferença entre legenda e legenda sincronizada: sem isto o texto
         sobe num ritmo fixo escolhido no chute e, em metade das cenas, a
         palavra aparece antes ou depois de ser falada — o defeito que faz o
         olho perceber "montagem automática" sem saber dizer por quê.

         O casamento é tolerante: ignora acento, caixa e pontuação, e procura
         só seis palavras à frente. Título e narração não são o mesmo texto
         (o título quebra linha, a narração tem conectivo a mais), então
         exigir casamento perfeito perderia tudo. O que não casa fica `null` e
         volta ao ritmo fixo — a cena nunca quebra por causa da legenda.
         ================================================================ */
      const semAcento = (x) => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "");
      const normPal = (x) => semAcento(x).toLowerCase().replace(/[^a-z0-9]/g, "");

      /* PALAVRA VAZIA NÃO ANCORA NADA. "de", "para", "a" e "o" aparecem cinco
         vezes numa narração de trinta palavras, e a subsequência máxima casa
         a da TELA com qualquer uma delas. Num teste real, o "de" e o "para"
         de uma manchete casaram com ocorrências no fim da fala e puxaram o
         título inteiro para 7 s dentro de uma cena de 8 — a lista embaixo
         não tinha mais tempo de existir.

         Só palavra de conteúdo ancora. As vazias ficam para a interpolação,
         que é justamente onde elas pertencem: entre duas âncoras. */
      const VAZIAS = new Set(
        ("a o as os e de do da dos das em no na nos nas um uma uns umas que se ao aos " +
          "com por pra para ou mas ja la ele ela isso este esta seu sua os as e")
          .split(" "),
      );
      const ancora = (n) => n.length > 2 && !VAZIAS.has(n);

      /* O casamento é feito por SUBSEQUÊNCIA COMUM MÁXIMA, não por busca em
         janela. Uma janela curta erra o caso mais comum do kit: o corpo da
         cena começa no meio da narração ("durante o procedimento…" quando a
         voz já disse "a cirurgia é feita com anestesia local, durante…"). A
         janela não alcança "durante", desiste das três primeiras palavras e
         então casa o "a" do corpo com o "A" que ABRE a narração — a palavra
         acende 4 s antes da hora e a linha aparece furada.

         A subsequência máxima não tem esse problema: ela escolhe o conjunto
         de pares que preserva a ordem dos dois lados ao mesmo tempo, então
         nenhum par pode cruzar outro. Custa n×m numa tabela de ~30×40. */
      function alinharVoz(textos, palavrasVoz) {
        const S = textos.map(normPal);
        const V = (palavrasVoz ?? []).map((w) => ({ n: normPal(w.texto), ini: w.ini }));
        const n = S.length;
        const m = V.length;
        const tempos = new Array(n).fill(null);
        if (!n || !m) return tempos;

        const casa = (i, j) => ancora(S[i]) && S[i] === V[j].n;
        const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
        for (let i = n - 1; i >= 0; i -= 1) {
          for (let j = m - 1; j >= 0; j -= 1) {
            dp[i][j] = casa(i, j)
              ? dp[i + 1][j + 1] + 1
              : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        let i = 0;
        let j = 0;
        while (i < n && j < m) {
          if (casa(i, j)) {
            tempos[i] = V[j].ini;
            i += 1;
            j += 1;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) i += 1;
          else j += 1;
        }
        return tempos;
      }

      /** Tapa os buracos do alinhamento. A palavra que não tem par na fala
       *  (pontuação virando token, conectivo que só existe num dos lados)
       *  recebe um instante INTERPOLADO entre as vizinhas casadas — nunca um
       *  passo fixo, que é o que faz uma palavra ultrapassar a seguinte e a
       *  linha nascer furada. Fora das pontas, extrapola pelo passo. */
      function interpolarTempos(tempos, piso, passo = 0.13) {
        const t = tempos.slice();
        const casadas = [];
        t.forEach((v, i) => {
          if (v != null) casadas.push(i);
        });
        if (!casadas.length) return t.map((_, i) => piso + i * passo);

        for (let k = 0; k < casadas.length - 1; k += 1) {
          const a = casadas[k];
          const b = casadas[k + 1];
          const vao = b - a;
          for (let i = a + 1; i < b; i += 1) {
            t[i] = t[a] + ((t[b] - t[a]) * (i - a)) / vao;
          }
        }
        const pri = casadas[0];
        for (let i = pri - 1; i >= 0; i -= 1) t[i] = t[i + 1] - passo;
        const ult = casadas.at(-1);
        for (let i = ult + 1; i < t.length; i += 1) t[i] = t[i - 1] + passo;

        // monotônica e nunca antes do piso da cena
        let anterior = -Infinity;
        return t.map((v) => {
          const x = Math.max(piso, v, anterior);
          anterior = x;
          return x;
        });
      }

      /** A narração virando legenda: uma palavra por span, para cada uma
       *  poder acender no seu instante. Mantém o [[destaque]] do roteiro. */
      function htmlLegenda(texto) {
        return tokenizar(texto)
          .map((linha) =>
            linha
              .map(
                (pal) =>
                  `<span class="pw">${pal
                    .map((seg) => (seg.k ? `<span class="vivo">${e(seg.t)}</span>` : e(seg.t)))
                    .join("")}</span>`,
              )
              .join(" "),
          )
          .join("<br>");
      }

      function tokenizar(texto) {
        const linhas = [[]];
        let palavra = [];
        let seg = "";
        let chave = false;
        const fechaSeg = () => {
          if (seg) {
            palavra.push({ t: seg, k: chave });
            seg = "";
          }
        };
        const fechaPalavra = () => {
          fechaSeg();
          if (palavra.length) {
            linhas.at(-1).push(palavra);
            palavra = [];
          }
        };
        for (let i = 0; i < texto.length; i += 1) {
          const c = texto[i];
          if (c === "[" && texto[i + 1] === "[") {
            fechaSeg();
            chave = true;
            i += 1;
          } else if (c === "]" && texto[i + 1] === "]") {
            fechaSeg();
            chave = false;
            i += 1;
          } else if (c === "\n") {
            fechaPalavra();
            linhas.push([]);
          } else if (c === " ") {
            fechaPalavra();
          } else seg += c;
        }
        fechaPalavra();
        return linhas;
      }

      function htmlCinetico(texto, escala) {
        const linhas = tokenizar(texto);
        const corpo = linhas
          .map((l) =>
            l
              .map(
                (pal) =>
                  `<span class="w"><span class="wi">${pal
                    .map((s) => (s.k ? `<span class="k">${e(s.t)}${SORRISO}</span>` : e(s.t)))
                    .join("")}</span></span>`,
              )
              .join(" "),
          )
          .join("<br>");
        return `<h2 class="vh ${escala}">${corpo}</h2>`;
      }

      const ESTRELA =
        "M12 2.2l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.27l-5.9 3.1 1.13-6.57L2.45 9.14l6.6-.96z";
      const BALAO = `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"><path d="M24 6C13.5 6 5 13.6 5 23c0 4.2 1.7 8 4.5 11L7 43l9.7-3.6c2.2.8 4.7 1.2 7.3 1.2 10.5 0 19-7.6 19-17S34.5 6 24 6z"/><path d="M16 21h16M16 28h10" stroke-linecap="round"/></svg>`;
      const PINO = `<svg viewBox="0 0 150 200"><path d="M75 196s66-62 66-116A66 66 0 0 0 9 80c0 54 66 116 66 116z" fill="#56A805"/><path d="M75 196s66-62 66-116A66 66 0 0 0 9 80c0 54 66 116 66 116z" fill="none" stroke="#032F01" stroke-width="5" opacity=".35"/><circle cx="75" cy="78" r="27" fill="#F7F8F2"/></svg>`;
      const CHK = `<svg class="chk" viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" pathLength="1"/><path d="M17 29.5l8.5 8.5 16-17" pathLength="1"/></svg>`;
      /* A curva do sorriso, esticada sob a palavra-chave. */
      /* O caminho real é refeito em pixels depois do layout (ver
         `ajustaSorrisos`): esticar um viewBox fixo deformaria o traço, e o
         non-scaling-stroke quebra o tracejado do desenho no Chromium. */
      const SORRISO = `<svg class="sub"><path d="M 0 0" pathLength="1"/></svg>`;
      /* O contorno da logo — a onda e o dente, sem as letras. É ele que se
         desenha, enorme e quase transparente, atrás das cenas lisas. */
      const LOGO_CONTORNO = `<svg viewBox="0 0 215.3945 73.9942"><g transform="translate(-49.7619 129.4957) scale(1 -1)"><path pathLength="1" d="M263.36 79.88C251.62 77.75 232.48 78.69 213.63 81.75C203.24 83.44 192.78 81.06 182.92 77.84C175.07 76.39 171.06 76.99 162.48 79.17C152.46 81.7 138.17 84.14 116.66 79.57C106.37 74.84 82.95 70.78 71.62 77.84C66.65 80.93 63.76 85.17 61.65 89.42C59.72 93.28 58.33 97.25 57.5 101.27C56.7 105.1 56.44 110.63 61.68 112.5C66.71 114.29 73.96 112.66 79.61 111.99C90.33 110.7 97.01 111.27 101.39 115.76C96.21 114.57 89.49 114.66 84.24 115.7C78.99 116.73 73.87 118.17 68.41 118.56C62.95 118.96 56.87 118.11 53.42 115.34C49.76 112.4 50 108.21 50.89 104.48C53.47 93.77 60.03 83.48 69.87 74.72C71.29 73.78 73.34 73.32 75.45 72.3C86.91 66.76 109.2 68.39 118.47 69.35C121.2 69.63 126.47 69.8 131.5 67.75C137.67 65.24 145.2 59.2 149.9 57.75C157.21 55.5 168.06 58.75 175.92 59.09C183.47 59.41 191.63 56.32 196.91 57.42C203.3 58.74 204.76 62.68 210.38 66.43C217.87 71.44 223.55 74.38 232.55 75.43C246.61 77.08 265.16 79.31 263.36 79.88ZM185.58 70.53C181.73 70.02 177.79 70.08 173.78 70.09C166.12 70.11 136.15 68.54 135.68 76.35C135.91 71.36 144.79 61.5 175 63.95C189.73 62.22 209.27 67.67 212.88 77.81C210.29 71.59 196.12 70.35 185.58 70.53Z"/><path pathLength="1" d="M106.59 98.15C109.38 103.88 110.57 110.38 109.98 116.73C109.73 119.44 109.13 122.19 107.68 124.49C105.39 128.11 101.23 129.5 97.09 128.74C93.01 127.99 89.6 125.15 86.75 122.29C84.19 119.71 80.87 115.88 76.78 117.21C77.07 117.12 77.54 116.31 77.86 116.1C80.47 114.32 83.88 116.07 86.39 117.15C89.87 118.66 92.41 120.24 95.69 122.14C97.27 123.06 99.48 123.16 101.35 122.53C105.33 121.18 106.21 116.23 106.76 112.7C107.51 107.89 107.18 102.96 106.59 98.15Z"/></g></svg>`;
      /** O número final, dígito a dígito, cada um numa coluna 0–9 repetida
       *  três vezes: a coluna rola até o dígito, passando por voltas inteiras. */
      function odometro(s) {
        const dec = Number(s.decimais ?? 0);
        const final = Number(s.valor).toLocaleString("pt-BR", {
          minimumFractionDigits: dec,
          maximumFractionDigits: dec,
          useGrouping: false,
        });
        const col = `<span class="col">${"012345678901234567890123456789"
          .split("")
          .map((n) => `<b>${n}</b>`)
          .join("")}</span>`;
        return [...final]
          .map((ch) =>
            /\d/.test(ch)
              ? `<span class="dg" data-d="${ch}">${col}</span>`
              : `<span class="sep">${e(ch)}</span>`,
          )
          .join("");
      }
      const ESTRELA_SVG = `<svg viewBox="0 0 24 24"><path d="M12 2.2l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.27l-5.9 3.1 1.13-6.57L2.45 9.14l6.6-.96z" fill="#56A805"/></svg>`;

      let ESTADO = null;

      /* ================================================================
         MONTAGEM — o vídeo inteiro vai para o DOM antes do primeiro quadro.
         Foto que só começa a baixar no quadro em que deveria aparecer sai
         como retângulo vazio por seis quadros: um piscar no meio do corte.
         ================================================================ */
      window.prepararVideo = async (roteiro) => {
        palco.innerHTML = "";
        const cenas = [];
        const eventos = [];
        const avisos = [];
        let relogio = 0;
        const n = roteiro.cenas.length;

        for (const [i, c] of roteiro.cenas.entries()) {
          const escura = c.superficie !== "clara";
          const ultima = i === n - 1;
          const tipo = c.tipo ?? (ultima && c.superficie === "clara" && c.selo ? "cta" : "texto");
          const gancho = i === 0;

          /* A transição é da cena que ENTRA. Arco na virada depois do gancho e
             no cartão final — os dois momentos que o vídeo precisa marcar.
             No meio, empurrão: a cena nova sobe e empurra a anterior. */
          const transicao = gancho
            ? "nenhuma"
            : (c.transicao ?? (i === 1 || tipo === "cta" ? "arco" : "empurra"));
          /* Quanto dura cada transição. "corte" vale 0 de propósito: é o
             corte seco, e é ele que dá o ritmo de 1,5 a 3 s que o briefing
             pede sem precisar encurtar a fala. */
          const DUR_TRANSICAO = {
            arco: 0.62,
            empurra: 0.5,
            dissolve: 0.34,
            lente: 0.52,
            cortina: 0.46,
            corte: 0,
            nenhuma: 0,
          };
          const tt = DUR_TRANSICAO[transicao] ?? 0;

          const div = document.createElement("div");
          div.className = `cena ${escura ? "escura" : "clara"}${c.foto ? " com-foto" : ""}`;
          div.style.zIndex = String(i + 1);

          if (c.foto) {
            div.innerHTML = `<div class="foto-cena"><img src="${e(c.foto)}" alt=""></div><div class="veu"></div>${gancho ? '<div class="brilho"></div>' : ""}`;
          }

          const conteudo = document.createElement("div");
          /* Sem foto, o conteudo vai para o CENTRO: ancorado embaixo, uma cena de
             fundo liso fica com dois tercos de verde vazio em cima, e le como
             slide que esqueceu o titulo. Com foto, ele fica embaixo, sobre a
             parte do veu que e escura o bastante para o texto. */
          const ancora = c.ancora ?? (c.foto || tipo === "local" ? "base" : "centro");
          conteudo.className = `conteudo${ancora === "centro" ? " centro" : ""}`;
          const partes = [];

          if (tipo === "cta") {
            partes.push(
              `<img class="lockup" data-a="lockup" src="${escura ? LOGO_ESCURO : LOGO_CLARO}" alt="">`,
            );
          }
          if (c.chip) partes.push(`<span class="vchip" data-a="chip"><i></i>${e(c.chip)}</span>`);
          let graf = null;
          if (c.grafico) {
            const gc = typeof c.grafico === "string" ? { tipo: c.grafico } : { ...c.grafico };
            const fab = GRAFICOS[gc.tipo];
            if (!fab) throw new Error(`ilustração desconhecida: ${String(gc.tipo)}`);
            graf = fab({ ...gc, id: `g${String(i)}` });
            partes.push(
              `<div class="grafico" data-a="grafico" style="height:${String(c.alturaGrafico ?? graf.h)}px">${graf.svg}</div>`,
            );
          }
          if (c.janela) {
            partes.push(
              `<div class="janela ${c.arco ? "arco" : ""}" data-a="janela" style="height:${String(c.alturaJanela ?? 700)}px"><img src="${e(c.janela)}" alt=""></div>`,
            );
          }
          if (c.titulo) partes.push(htmlCinetico(c.titulo, c.escala ?? "v-g"));
          if (tipo === "pessoas" || tipo === "pessoa") {
            const lista = tipo === "pessoa" ? [c.pessoa] : c.pessoas;
            partes.push(
              `<div class="pessoas n${String(lista.length)}">${lista
                .map(
                  (p) =>
                    `<figure class="pp" data-a="pessoa"><div class="moldura${p.opaco ? " opaco" : ""}"><div class="fundo"></div><img src="${e(p.foto)}" alt=""></div><b>${e(p.nome)}</b>${p.papel ? `<span>${e(p.papel)}</span>` : ""}${p.registro ? `<em data-a="registro">${e(p.registro)}</em>` : ""}</figure>`,
                )
                .join("")}</div>`,
            );
          }
          if (tipo === "numeros") {
            partes.push(
              `<div class="stats${c.numeros.length === 1 ? " unico" : ""}">${c.numeros
                .map(
                  (s) =>
                    `<div class="stat" data-a="stat" data-alvo="${String(s.valor)}" data-de="${String(s.de ?? 0)}" data-dec="${String(s.decimais ?? 0)}"${s.estrelas ? ` data-estrelas="${String(s.estrelas)}"` : ""}><div class="num"><span class="n">${odometro(s)}</span>${s.sufixo ? `<small>${e(s.sufixo)}</small>` : ""}</div>${s.estrelas ? `<div class="vestrelas">${[0, 1, 2, 3, 4].map((k) => `<svg viewBox="0 0 24 24"><defs><clipPath id="c${String(i)}_${String(k)}_${String(s.valor).replace(".", "")}"><rect class="corte" x="0" y="0" width="0" height="24"/></clipPath></defs><path d="${ESTRELA}" fill="${escura ? "rgba(255,255,255,.16)" : "#DCE4D6"}"/><path d="${ESTRELA}" fill="#56A805" clip-path="url(#c${String(i)}_${String(k)}_${String(s.valor).replace(".", "")})"/></svg>`).join("")}</div>` : ""}${s.rotulo ? `<div class="rot">${rico(s.rotulo)}</div>` : ""}</div>`,
                )
                .join("")}</div>`,
            );
          }
          if (c.corpo && tipo !== "cta")
            partes.push(
              `<p class="vp" data-a="corpo">${c._voz ? htmlLegenda(c.corpo) : rico(c.corpo)}</p>`,
            );
          if (c.itens?.length) {
            partes.push(
              `<div class="lista">${c.itens.map((it) => `<div class="item" data-a="item">${CHK}<span>${rico(it)}</span></div>`).join("")}</div>`,
            );
          }
          if (tipo === "etapas") {
            partes.push(
              `<div class="etapas"><div class="trilho"><i></i></div>${c.etapas
                .map(
                  (et, k) =>
                    `<div class="etapa" data-a="etapa"><span class="no">${String(k + 1)}</span><div><h4>${e(et.titulo)}</h4>${et.texto ? `<p>${e(et.texto)}</p>` : ""}</div></div>`,
                )
                .join("")}</div>`,
            );
          }
          if (tipo === "comparar") {
            partes.push(
              `<div class="comp"><div class="card" data-a="cardA">${c.a.rotulo ? `<span class="rot">${e(c.a.rotulo)}</span>` : ""}<h4>${e(c.a.titulo)}</h4><p>${rico(c.a.texto)}</p></div><div class="versus" data-a="versus">×</div><div class="card" data-a="cardB">${c.b.rotulo ? `<span class="rot">${e(c.b.rotulo)}</span>` : ""}<h4>${e(c.b.titulo)}</h4><p>${rico(c.b.texto)}</p></div></div>`,
            );
            if (c.nota) partes.push(`<p class="vp" data-a="corpo">${rico(c.nota)}</p>`);
          }
          if (tipo === "local" && c.chips?.length) {
            partes.push(
              `<div class="chips">${c.chips.map((ch) => `<span class="vchip" data-a="chipLocal"><i></i>${e(ch)}</span>`).join("")}</div>`,
            );
          }
          if (c.selo) {
            partes.push(
              `<div class="pilula" data-a="pilula">${BALAO}<span>${rico(c.selo)}</span><i class="reflexo"></i></div>`,
            );
          }
          if (c.prova)
            partes.push(
              `<div class="prova" data-a="prova">${ESTRELA_SVG}<span>${rico(c.prova)}</span></div>`,
            );
          if (tipo === "cta" && c.corpo)
            partes.push(`<p class="rodape-cta" data-a="corpo">${rico(c.corpo)}</p>`);

          conteudo.innerHTML = partes.join("");
          /* Cena lisa (sem foto, janela nem ilustração) ganha o contorno da
             logo se desenhando ao fundo, alternando o lado. */
          if (!c.foto && !c.janela && !c.grafico) {
            const lado = tipo !== "cta" && i % 2 ? " esq" : "";
            div.insertAdjacentHTML(
              "beforeend",
              `<div class="marca-fundo${lado}">${LOGO_CONTORNO}</div>`,
            );
          }
          div.appendChild(conteudo);
          if (c.selo) {
            const toque = document.createElement("div");
            toque.className = "toque";
            div.appendChild(toque);
          }

          if (tipo === "local") {
            const pino = document.createElement("div");
            pino.className = "pino";
            pino.innerHTML = PINO;
            const ondas = [0, 1].map(() => {
              const o = document.createElement("div");
              o.className = "onda";
              return o;
            });
            if (c.pino) {
              pino.style.left = `${String(c.pino[0] - 75)}px`;
              pino.style.top = `${String(c.pino[1] - 200)}px`;
              ondas.forEach((o) => {
                o.style.left = `${String(c.pino[0])}px`;
                o.style.top = `${String(c.pino[1])}px`;
              });
            }
            div.append(...ondas, pino);
          }

          const sombra = document.createElement("div");
          sombra.className = "sombra";
          div.appendChild(sombra);
          palco.appendChild(div);

          const inicio = relogio;
          const fim = relogio + c.t;
          relogio = fim;
          cenas.push({
            cfg: c,
            i,
            tipo,
            gancho,
            div,
            conteudo,
            sombra,
            inicio,
            fim,
            tt,
            transicao,
            escura,
            graf,
            /* as marcas de palavra vêm de lib/voz.mjs, em tempo DA CENA */
            vozPalavras: c._voz ? c._voz.palavras : null,
            anims: [],
          });
        }

        /* Assinatura e anel: são do vídeo, não da cena. Barra de progresso não
           existe: a clínica pediu para tirar (18/09/2026) — o Reel já tem a
           dele, e uma segunda linha no pé da tela só disputa com a legenda. */
        const ass = document.createElement("div");
        ass.className = "assinatura";
        ass.innerHTML = `<img src="${LOGO_ESCURO}" alt="JP Clínica Odontológica"><span style="color:#E2F0D8">@jpclinicaodontologica</span>`;
        const anel = document.createElement("div");
        anel.className = "anel";
        palco.append(ass, anel);

        await document.fonts.ready;
        const imgs = [...palco.querySelectorAll("img")];
        await Promise.all(
          imgs.map(
            (img) =>
              new Promise((ok, falha) => {
                if (img.complete && img.naturalWidth > 0) return ok();
                img.addEventListener("load", ok, { once: true });
                img.addEventListener(
                  "error",
                  () => falha(new Error(`imagem não carregou: ${img.getAttribute("src")}`)),
                  {
                    once: true,
                  },
                );
              }),
          ),
        );
        await Promise.all(imgs.map((im) => im.decode().catch(() => {})));

        /* ==============================================================
           A AGENDA DE CADA CENA — quando cada elemento entra.
           Calculada DEPOIS do layout, porque o trilho das etapas precisa
           saber a altura real de cada estação.
           ============================================================== */
        const corTitulo = (esc) => hex(esc ? "#F6FAF2" : "#095902");
        const corChave = (esc) => hex(esc ? "#8EDE2E" : "#56A805");

        for (const cena of cenas) {
          const { div, conteudo, escura, gancho, tipo } = cena;
          div.style.visibility = "visible"; // layout precisa da cena visível
          // o sorriso de cada palavra-chave, desenhado no tamanho exato dela
          conteudo.querySelectorAll(".k .sub").forEach((sb) => {
            const r = sb.getBoundingClientRect();
            const w = Math.max(10, r.width);
            const a = Math.max(6, r.height);
            sb.setAttribute("viewBox", `0 0 ${w.toFixed(1)} ${a.toFixed(1)}`);
            sb.querySelector("path").setAttribute(
              "d",
              `M ${(w * 0.03).toFixed(1)} ${(a * 0.2).toFixed(1)} Q ${(w / 2).toFixed(1)} ${(a * 1.3).toFixed(1)} ${(w * 0.97).toFixed(1)} ${(a * 0.2).toFixed(1)}`,
            );
          });
          const A = cena.anims;
          let cursor = gancho ? 0.04 : 0.1;
          const add = (fn) => A.push(fn);

          /* ==============================================================
             SUB-CORTE — o segundo ângulo dentro da mesma cena.

             O PROBLEMA. Amarrar a duração da cena à frase falada acertou a
             sincronia e custou o ritmo: uma frase do locutor leva 4 a 6 s,
             então uma cena é uma frase, e o vídeo corta a cada 5,5 s. O
             briefing pede corte a cada 1,5 a 3 s. Cortar no meio da frase
             devolveria o ritmo e quebraria justamente o que o motor tem de
             melhor.

             A SAÍDA. Corta-se a IMAGEM sem cortar a CENA. No instante do
             sub-corte o enquadramento salta — outra escala, outro centro —
             como se uma segunda câmera entrasse. A frase continua inteira,
             a legenda continua acesa, e o olho recebe um corte.

             E O CORTE CAI NA FALA. O instante não é um relógio: é encaixado
             no INÍCIO DE UMA PALAVRA da narração. Corte que cai no meio de
             uma sílaba parece defeito de codificação; corte que cai junto
             com uma palavra parece decisão de montagem. É a mesma lista de
             marcas que acende a legenda, usada para outra coisa.
             ============================================================== */
          const ENQUADRAMENTOS = [
            { esc: 1.0, dx: 0, dy: 0 },
            { esc: 1.26, dx: -3, dy: -9 },
            { esc: 1.17, dx: 7, dy: 5 },
            { esc: 1.33, dx: -8, dy: 7 },
            { esc: 1.21, dx: 4, dy: -6 },
          ];
          /* Um sub-corte a cada ~2,2 s de cena, que é o meio da faixa de 1,5 a 3 s
             do briefing quando somado aos cortes de cena. Nunca durante a entrada
             (0,9 s) nem colado no corte de saída (0,7 s): nesses dois
             trechos já existe movimento, e um salto em cima dele lê como
             engasgo em vez de corte. */
          const PASSO_SUBCORTE = 1.9;
          /* Teto de três por cena: além disso o reenquadramento deixa de ser
             montagem e vira inquietação — e o briefing proíbe nominalmente o
             movimento sem motivo. */
          const MAX_SUBCORTES = 3;
          const GUARDA_ENTRADA = 0.9;
          const GUARDA_SAIDA = 0.7;

          function montarSubcortes() {
            const dur = cena.fim - cena.inicio;
            const util = dur - GUARDA_ENTRADA - GUARDA_SAIDA;
            const quantos = Math.min(MAX_SUBCORTES, Math.floor(util / PASSO_SUBCORTE));
            if (quantos < 1) return [];
            const marcas = cena.vozPalavras ?? [];
            const saida = [];
            for (let k = 1; k <= quantos; k += 1) {
              const alvo = GUARDA_ENTRADA + (util * k) / (quantos + 1);
              // encaixa no começo da palavra mais próxima, se houver uma perto
              let instante = alvo;
              let menor = 0.42;
              for (const w of marcas) {
                const d = Math.abs(w.ini - alvo);
                if (d < menor) {
                  menor = d;
                  instante = w.ini;
                }
              }
              // a sequência de enquadramentos é determinística: o motor tem de
              // devolver o mesmo quadro para o mesmo t, em qualquer máquina
              const escolha = ENQUADRAMENTOS[(cena.i * 2 + k) % ENQUADRAMENTOS.length];
              saida.push({ t: instante, ...escolha });
            }
            return saida;
          }

          /* Só a cena que TEM o que reenquadrar. Texto sobre fundo liso não
             tem segundo ângulo possível: saltar o bloco de texto não é um
             corte, é um sobressalto. */
          const temImagem = Boolean(cena.cfg.foto || cena.cfg.grafico || cena.cfg.janela);
          cena.subcortes = temImagem ? montarSubcortes() : [];
          if (cena.subcortes.length) {
            cena.subcortes.forEach((sc) =>
              eventos.push({ t: cena.inicio + sc.t, tipo: "tick" }),
            );
          }
          /** O enquadramento ativo no instante local `l`. */
          const enquadrar = (l) => {
            let atual = { esc: 1, dx: 0, dy: 0 };
            for (const sc of cena.subcortes) {
              if (l >= sc.t) atual = sc;
            }
            return atual;
          };

          /* No gancho com palavra-chave, a abertura é da palavra gigante: o
             chip espera ela pousar. */
          const temHeroi = gancho && Boolean(conteudo.querySelector(".vh .k"));

          const lockup = conteudo.querySelector('[data-a="lockup"]');
          if (lockup) {
            const s = cursor;
            add((l) => {
              const p = outExpo(faixa(l, s, 1.0));
              lockup.style.opacity = String(c01(p * 4));
              lockup.style.clipPath = `inset(-10% ${String(100 * (1 - p))}% -10% 0)`;
              lockup.style.transform = `translateX(${String(-40 * (1 - p))}px)`;
            });
            cursor += 0.3;
          }

          const chip = conteudo.querySelector('[data-a="chip"]');
          if (chip) {
            const s = temHeroi ? 1.3 : cursor;
            add((l) => {
              const p = outCubic(faixa(l, s, 0.5));
              chip.style.opacity = String(p);
              chip.style.transform = `translateX(${String(-34 * (1 - p))}px)`;
            });
            if (!temHeroi) cursor += 0.16;
          }

          const gdiv = conteudo.querySelector('[data-a="grafico"]');
          if (gdiv && cena.graf) {
            const s = cursor;
            add((l) => {
              gdiv.style.opacity = String(outCubic(faixa(l, s, 0.35)));
              const q = enquadrar(l);
              // na ilustração o salto é mais contido: o desenho é fino, e
              // ampliar demais engrossa o traço até ele virar mancha
              gdiv.style.transformOrigin = "50% 46%";
              gdiv.style.transform =
                `translate(${String(q.dx * 0.55)}%, ${String(q.dy * 0.5)}%) ` +
                `scale(${String(1 + (q.esc - 1) * 0.62)})`;
            });
            cena.fimGrafico = cena.graf.anima(gdiv, add, s + 0.05, (tr, tipo, extra = {}) =>
              eventos.push({ t: cena.inicio + tr, tipo, ...extra }),
            );
            cursor += 0.35;
          }

          const janela = conteudo.querySelector('[data-a="janela"]');
          let tJanela = null;
          if (janela) {
            const s = cursor;
            tJanela = s;
            const im = janela.querySelector("img");
            add((l) => {
              const p = inOutCubic(faixa(l, s, 0.75));
              janela.style.clipPath = `inset(${String(100 * (1 - p))}% 0 0 0 round 38px)`;
              const z = faixa(l, s, cena.fim - cena.inicio);
              const q = enquadrar(l);
              im.style.transform =
                `translate(${String(q.dx)}%, ${String(q.dy)}%) ` +
                `scale(${String((1.16 - 0.1 * outCubic(z)) * q.esc)})`;
            });
            cursor += 0.45;
          }

          // headline palavra a palavra
          const h = conteudo.querySelector(".vh");
          let fimTitulo = cursor;
          if (h) {
            const palavras = [...h.querySelectorAll(".w")];
            const stagger = gancho ? 0.05 : 0.06;
            const dur = gancho ? 0.5 : 0.56;
            let s = cursor;
            const base = corTitulo(escura);
            const viva = corChave(escura);
            h.style.color = rgb(base);

            /* IMPACTO. No gancho, as palavras-chave da primeira linha que tem
               uma começam gigantes no centro da tela — é o primeiro quadro do
               vídeo — seguram meio segundo e voam até o lugar delas na frase.
               O resto da frase sobe enquanto elas voam. */
            let herois = [];
            let tPouso = null;
            if (temHeroi) {
              const linhaK = h.querySelector(".k").closest(".w").offsetTop;
              herois = palavras.filter((w) => w.querySelector(".k") && w.offsetTop === linhaK);
            }
            if (herois.length) {
              const rd = div.getBoundingClientRect();
              const rs = herois.map((w) => w.querySelector(".wi").getBoundingClientRect());
              const ux = Math.min(...rs.map((r) => r.left)) - rd.left;
              const uy = Math.min(...rs.map((r) => r.top)) - rd.top;
              const uw = Math.max(...rs.map((r) => r.right)) - rd.left - ux;
              const uh = Math.max(...rs.map((r) => r.bottom)) - rd.top - uy;
              const heroi = document.createElement("div");
              heroi.className = `heroi ${h.className}`;
              heroi.innerHTML = herois.map((w) => w.querySelector(".wi").innerHTML).join(" ");
              heroi.querySelectorAll(".sub").forEach((sb) => sb.remove());
              heroi.style.left = `${String(ux)}px`;
              heroi.style.top = `${String(uy)}px`;
              heroi.style.color = rgb(base);
              heroi.querySelectorAll(".k").forEach((kk) => (kk.style.color = rgb(viva)));
              div.appendChild(heroi);
              const escrim = document.createElement("div");
              escrim.className = "escrim";
              div.appendChild(escrim);
              const S0 = Math.min(3.1, 860 / uw);
              const dx0 = 540 - (uw * S0) / 2 - ux;
              const dy0 = 850 - (uh * S0) / 2 - uy;
              const tVoo = 0.56;
              const dVoo = 0.55;
              tPouso = tVoo + dVoo;
              add((l) => {
                const bate = outExpo(faixa(l, 0, 0.45));
                const v = inOutCubic(faixa(l, tVoo, dVoo));
                const esc = S0 * (1 + 0.08 * (1 - bate));
                const S = esc + (1 - esc) * v;
                heroi.style.transform = `translate(${String(dx0 * (1 - v))}px, ${String(dy0 * (1 - v))}px) scale(${String(S)})`;
                heroi.style.opacity = l < tPouso ? "1" : "0";
                escrim.style.opacity = String(1 - outCubic(faixa(l, tVoo, dVoo)));
              });
              eventos.push({ t: 0, tipo: "impacto" });
              eventos.push({ t: tVoo, tipo: "voo", dur: dVoo });
              // o resto da frase sobe quando a palavra já passou por ele —
              // antes disso, as duas se cruzam no ar
              s = tVoo + dVoo * 0.72;
            }
            const outras = palavras.filter((w) => !herois.includes(w));
            /* O TÍTULO SOBE NO RITMO DA FALA. Cada palavra da manchete procura
               a sua gêmea na narração e sobe 0,14 s ANTES de ser dita — o
               olho chega na palavra junto com o ouvido, não atrás dele. A
               palavra que não casa (conectivo que só existe na fala, quebra
               de linha do título) mantém o ritmo fixo de antes. */
            const cruTitulo = cena.vozPalavras
              ? alinharVoz(
                  palavras.map((w) => w.textContent),
                  cena.vozPalavras,
                )
              : palavras.map(() => null);
            /* Título com menos de duas âncoras volta INTEIRO ao ritmo fixo.

               O "inteiro" é o ponto, e custou um render para aprender: a
               manchete "O pós-operatório varia de caso para caso" tinha uma
               âncora só — "varia" — que a narração dizia aos 7 s de uma cena
               de 8. Devolver o vetor cru deixava as outras palavras no ritmo
               fixo e "varia" no tempo da voz: a palavra subia depois de todas
               as outras, quase no corte, e o título ficava lendo
               "O pós-operatório ___ de caso para caso" durante seis segundos.

               Uma âncora não é sincronia: é uma palavra atrasada. */
            const temPar = cruTitulo.filter((v) => v != null).length >= 2;
            const tempoTitulo = temPar
              ? interpolarTempos(cruTitulo, s)
              : palavras.map(() => null);
            /* TETO. A manchete inteira tem de estar na tela antes do último
               terço da cena, mesmo que a voz só diga aquela palavra no fim.
               Aparecer ANTES do som é inofensivo — o olho lê e espera o
               ouvido. Aparecer DEPOIS é uma palavra que pisca e some no
               corte, que é o defeito que esta trava existe para impedir. */
            const tetoTitulo = (cena.fim - cena.inicio) * 0.64;
            const entradaDe = (w) => {
              const tv = tempoTitulo[palavras.indexOf(w)];
              if (tv == null) return s + outras.indexOf(w) * stagger;
              return Math.min(tetoTitulo, Math.max(s, tv - 0.14));
            };
            fimTitulo = Math.max(
              s + Math.max(0, outras.length - 1) * stagger + dur,
              tPouso ?? 0,
              ...outras.map((w) => entradaDe(w) + dur),
            );
            const tAcende = fimTitulo - 0.05;
            palavras.forEach((w) => {
              const wi = w.querySelector(".wi");
              const ks = [...w.querySelectorAll(".k")];
              const ehHeroi = herois.includes(w);
              const inicioW = entradaDe(w);
              add((l) => {
                if (ehHeroi) {
                  wi.style.transform = "none";
                  wi.style.opacity = l >= tPouso ? "1" : "0";
                } else {
                  const p = outQuart(faixa(l, inicioW, dur));
                  wi.style.transform = `translateY(${String(135 * (1 - p))}%)`;
                }
                if (ks.length) {
                  const pc = ehHeroi ? 1 : outCubic(faixa(l, tAcende, 0.45));
                  ks.forEach((kk, j) => {
                    kk.style.color = rgb(mix(base, viva, pc));
                    risca(
                      kk.querySelector(".sub path"),
                      outCubic(faixa(l, tAcende + 0.08 + j * 0.06, 0.55)),
                    );
                  });
                }
              });
            });
            if (h.querySelector(".k")) eventos.push({ t: cena.inicio + tAcende, tipo: "brilho" });
            cursor = fimTitulo - 0.18;
          }

          // pessoas: sobem para dentro do arco, uma de cada vez
          const pessoas = [...conteudo.querySelectorAll('[data-a="pessoa"]')];
          pessoas.forEach((pp, k) => {
            const s = cursor + k * 0.28;
            const mold = pp.querySelector(".moldura");
            const img = mold.querySelector("img");
            const fundo = mold.querySelector(".fundo");
            const legenda = [...pp.children].filter((x) => x !== mold);
            const reg = pp.querySelector('[data-a="registro"]');
            add((l) => {
              const pf = outCubic(faixa(l, s, 0.55));
              fundo.style.transform = `scaleY(${String(0.2 + 0.8 * pf)})`;
              fundo.style.transformOrigin = "50% 100%";
              fundo.style.opacity = String(pf);
              const pi = outQuart(faixa(l, s + 0.12, 0.7));
              img.style.opacity = String(pi);
              img.style.transform = `translateX(-50%) translateY(${String(70 * (1 - pi))}px)`;
              if (mold.classList.contains("opaco"))
                img.style.transform = `translateX(-50%) translateY(${String(40 * (1 - pi))}px)`;
              const pl = outCubic(faixa(l, s + 0.4, 0.5));
              legenda.forEach((el) => {
                if (el === reg) return;
                el.style.opacity = String(pl);
                el.style.transform = `translateY(${String(14 * (1 - pl))}px)`;
              });
              if (reg) {
                const pr = faixa(l, s + 0.62, 0.55);
                reg.style.opacity = pr > 0 ? "1" : "0";
                reg.style.clipPath = `inset(0 ${String(100 * (1 - pr))}% 0 0)`;
              }
            });
            eventos.push({ t: cena.inicio + s + 0.12, tipo: "sopro" });
          });
          if (pessoas.length) cursor += 0.28 * pessoas.length + 0.5;

          // números que contam
          const stats = [...conteudo.querySelectorAll('[data-a="stat"]')];
          stats.forEach((st, k) => {
            const s = cursor + 0.05 + k * 0.72;
            const estrelas = st.dataset.estrelas ? Number(st.dataset.estrelas) : null;
            const cortes = [...st.querySelectorAll(".corte")];
            /* RODA: cada dígito rola na sua coluna; o da direita dá duas
               voltas, os outros uma, e cada um começa um instante depois do
               vizinho da esquerda — o número "assenta" da esquerda para a
               direita, como odômetro. */
            const digitos = [...st.querySelectorAll(".dg")];
            add((l) => {
              const pa = outCubic(faixa(l, s, 0.4));
              st.style.opacity = String(pa);
              st.style.transform = `translateY(${String(30 * (1 - pa))}px)`;
              digitos.forEach((dg, j) => {
                const voltas = j === digitos.length - 1 ? 20 : 10;
                const alvoD = voltas + Number(dg.dataset.d);
                const pr = outQuart(faixa(l, s + 0.05 + j * 0.08, 1.25));
                dg.firstElementChild.style.transform = `translateY(${String(-0.86 * alvoD * pr)}em)`;
              });
              if (estrelas !== null) {
                const cheio = estrelas * outCubic(faixa(l, s + 0.2, 1.1));
                cortes.forEach((r, j) => r.setAttribute("width", String(24 * c01(cheio - j))));
              }
            });
            eventos.push({ t: cena.inicio + s + 0.05, tipo: "conta", dur: 1.15 });
          });
          if (stats.length) cursor += 0.72 * stats.length + 0.5;

          // corpo
          const corpos = [...conteudo.querySelectorAll('[data-a="corpo"]')];
          corpos.forEach((cp, k) => {
            const s = cursor + k * 0.15;
            const pws = [...cp.querySelectorAll(".pw")];
            if (pws.length && cena.vozPalavras) {
              /* LEGENDA KARAOKÊ. Cada palavra entra no instante em que é dita
                 e fica acesa enquanto dura o som dela. O bloco inteiro não
                 tem mais opacidade própria: quem aparece é a palavra. */
              const tempos = alinharVoz(
                pws.map((w) => w.textContent),
                cena.vozPalavras,
              );
              const ditas = interpolarTempos(tempos, s);
              // a palavra sobe 0,1 s antes do som dela: o olho chega junto
              const entra = ditas.map((tv) => Math.max(s, tv - 0.1));
              cp.style.opacity = "1";
              cp.style.transform = "none";
              pws.forEach((w, j) => {
                const e0 = entra[j];
                const fimDita = ditas[j] + 0.42;
                add((l) => {
                  const p = outCubic(faixa(l, e0, 0.3));
                  w.style.opacity = String(p);
                  w.style.transform = `translateY(${String(9 * (1 - p))}px)`;
                  const dita = l >= e0 && l < fimDita;
                  if (dita !== w.classList.contains("dita")) w.classList.toggle("dita", dita);
                });
              });
            } else {
              add((l) => {
                const p = outCubic(faixa(l, s, 0.6));
                cp.style.opacity = String(p);
                cp.style.transform = `translateY(${String(22 * (1 - p))}px)`;
              });
            }
          });
          if (corpos.length && tipo !== "comparar") cursor += 0.3;

          // lista com o check se desenhando
          const itens = [...conteudo.querySelectorAll('[data-a="item"]')];
          itens.forEach((it, k) => {
            const s = cursor + 0.1 + k * 0.36;
            const circ = it.querySelector("circle");
            const risco = it.querySelector("path");
            const txt = it.querySelector("span");
            add((l) => {
              const pc = outCubic(faixa(l, s, 0.42));
              circ.style.strokeDashoffset = String(1 - pc);
              circ.style.fill = `rgba(86,168,5,${String(0.2 * outCubic(faixa(l, s + 0.3, 0.3)))})`;
              risco.style.strokeDashoffset = String(1 - outCubic(faixa(l, s + 0.22, 0.32)));
              const pt = outCubic(faixa(l, s + 0.06, 0.5));
              txt.style.opacity = String(pt);
              txt.style.transform = `translateX(${String(26 * (1 - pt))}px)`;
            });
            eventos.push({ t: cena.inicio + s + 0.24, tipo: "tick" });
          });
          if (itens.length) cursor += 0.1 + itens.length * 0.36 + 0.3;

          // etapas: o trilho se desenha e acende cada estação
          const etapas = [...conteudo.querySelectorAll('[data-a="etapa"]')];
          if (etapas.length) {
            const box = conteudo.querySelector(".etapas");
            const trilho = box.querySelector(".trilho");
            const fill = trilho.querySelector("i");
            const bb = box.getBoundingClientRect();
            const centros = etapas.map((et) => {
              const r = et.querySelector(".no").getBoundingClientRect();
              return r.top + r.height / 2 - bb.top;
            });
            const topo = centros[0];
            const altura = centros.at(-1) - topo;
            trilho.style.top = `${String(topo)}px`;
            trilho.style.height = `${String(altura)}px`;
            const s = cursor + 0.1;
            const passo = 0.62;
            const durTrilho = passo * (etapas.length - 1);
            add((l) => {
              const p = faixa(l, s + 0.25, durTrilho);
              fill.style.height = `${String(100 * p)}%`;
              trilho.style.opacity = String(outCubic(faixa(l, s, 0.3)));
            });
            etapas.forEach((et, k) => {
              const tk = s + 0.25 + k * passo - 0.12;
              const no = et.querySelector(".no");
              const txt = no.nextElementSibling;
              add((l) => {
                const pa = outCubic(faixa(l, tk - 0.2, 0.4));
                no.style.opacity = String(Math.max(0.35, pa));
                const acende = outBack(faixa(l, tk, 0.38));
                const pa2 = c01(acende);
                no.style.transform = `scale(${String(0.8 + 0.2 * acende)})`;
                no.style.background = pa2 > 0.5 ? "#56A805" : "";
                no.style.color = pa2 > 0.5 ? "#032F01" : "";
                no.style.borderColor = pa2 > 0.5 ? "#56A805" : "";
                const pt = outCubic(faixa(l, tk - 0.05, 0.5));
                txt.style.opacity = String(pt);
                txt.style.transform = `translateX(${String(30 * (1 - pt))}px)`;
              });
              eventos.push({ t: cena.inicio + tk, tipo: "tick" });
            });
            cursor = s + 0.25 + durTrilho + 0.4;
          }

          // comparar: cartões entram de lados opostos, o × assenta no meio
          const cardA = conteudo.querySelector('[data-a="cardA"]');
          if (cardA) {
            const cardB = conteudo.querySelector('[data-a="cardB"]');
            const vs = conteudo.querySelector('[data-a="versus"]');
            const s = cursor + 0.05;
            add((l) => {
              const pa = outQuart(faixa(l, s, 0.65));
              cardA.style.opacity = String(pa);
              cardA.style.transform = `translateX(${String(-140 * (1 - pa))}px)`;
              const pb = outQuart(faixa(l, s + 0.55, 0.65));
              cardB.style.opacity = String(pb);
              cardB.style.transform = `translateX(${String(140 * (1 - pb))}px)`;
              const pv = outBack(faixa(l, s + 1.0, 0.45));
              vs.style.opacity = String(c01(pv * 2));
              vs.style.transform = `scale(${String(Math.max(0, pv))})`;
            });
            eventos.push({ t: cena.inicio + s, tipo: "sopro" });
            eventos.push({ t: cena.inicio + s + 0.55, tipo: "sopro" });
            eventos.push({ t: cena.inicio + s + 1.05, tipo: "pop" });
            cursor = s + 1.5;
          }

          // chips de bairro
          const chipsLocal = [...conteudo.querySelectorAll('[data-a="chipLocal"]')];
          chipsLocal.forEach((ch, k) => {
            const s = cursor + k * 0.14;
            add((l) => {
              const p = outBack(faixa(l, s, 0.45));
              ch.style.opacity = String(c01(p * 1.5));
              ch.style.transform = `scale(${String(0.7 + 0.3 * p)})`;
            });
          });
          if (chipsLocal.length) cursor += chipsLocal.length * 0.14 + 0.3;

          // pino que cai e pulsa
          const pino = div.querySelector(".pino");
          if (pino) {
            const ondas = [...div.querySelectorAll(".onda")];
            /* Com janela, o pino cai SOBRE a placa da fachada, dentro da
               moldura em arco — e nao sobre a foto sangrada, onde ele disputava
               lugar com o letreiro e com o texto da cena. */
            if (janela && !cena.cfg.pino) {
              const rj = janela.getBoundingClientRect();
              const rd = div.getBoundingClientRect();
              const cx = rj.left - rd.left + rj.width / 2;
              const cy = rj.top - rd.top + rj.height * 0.62;
              pino.style.left = `${String(cx - 75)}px`;
              pino.style.top = `${String(cy - 200)}px`;
              ondas.forEach((o) => {
                o.style.left = `${String(cx)}px`;
                o.style.top = `${String(cy)}px`;
              });
            }
            const s = tJanela !== null ? tJanela + 0.62 : 0.25;
            add((l) => {
              const p = faixa(l, s, 0.62);
              const q = outBack(p);
              pino.style.opacity = String(c01(p * 3));
              pino.style.transform = `translateY(${String(-260 * (1 - q))}px)`;
              ondas.forEach((o, k) => {
                const ciclo = (((l - s - 0.55 - k * 0.7) % 1.4) + 1.4) % 1.4;
                const ativo = l > s + 0.55 + k * 0.7;
                const po = ciclo / 1.4;
                o.style.opacity = ativo ? String(0.9 * (1 - po)) : "0";
                o.style.transform = `scale(${String(0.3 + 1.2 * po)})`;
              });
            });
            eventos.push({ t: cena.inicio + s + 0.5, tipo: "pop" });
          }

          // pílula do WhatsApp: assenta e recebe um reflexo
          /* O botão assenta, recebe o reflexo, e é TOCADO duas vezes: o dedo
             invisível aperta, o anel sai do ícone. É a ação desenhada, não
             pedida. */
          const pilula = conteudo.querySelector('[data-a="pilula"]');
          if (pilula) {
            const s = cursor + 0.1;
            const reflexo = pilula.querySelector(".reflexo");
            const toque = div.querySelector(".toque");
            const ic = pilula.querySelector("svg").getBoundingClientRect();
            const rd = div.getBoundingClientRect();
            toque.style.left = `${String(ic.left - rd.left + ic.width / 2)}px`;
            toque.style.top = `${String(ic.top - rd.top + ic.height / 2)}px`;
            const toques = [s + 1.05, s + 2.35];
            add((l) => {
              const p = outBack(faixa(l, s, 0.5));
              let aperto = 0;
              let anel = 0;
              let anelOp = 0;
              toques.forEach((tq) => {
                const pt = faixa(l, tq, 0.24);
                if (pt > 0 && pt < 1) aperto = Math.max(aperto, Math.sin(Math.PI * pt));
                const pa = faixa(l, tq + 0.06, 0.75);
                if (pa > 0 && pa < 1) {
                  anel = pa;
                  anelOp = 0.85 * (1 - pa);
                }
              });
              pilula.style.opacity = String(c01(p * 1.6));
              pilula.style.transform = `scale(${String((0.82 + 0.18 * p) * (1 - 0.045 * aperto))})`;
              const pr = inOutCubic(faixa(l, s + 0.55, 0.8));
              reflexo.style.transform = `translateX(${String(-120 + 240 * pr)}%)`;
              toque.style.opacity = String(anelOp);
              toque.style.transform = `scale(${String(0.3 + 1.3 * outCubic(anel))})`;
            });
            eventos.push({ t: cena.inicio + s + 0.2, tipo: "pop" });
            toques.forEach((tq) => eventos.push({ t: cena.inicio + tq, tipo: "toque" }));
            cursor = s + 0.6;
          }
          const prova = conteudo.querySelector('[data-a="prova"]');
          if (prova) {
            const s = cursor;
            add((l) => {
              const p = outCubic(faixa(l, s, 0.5));
              prova.style.opacity = String(p);
              prova.style.transform = `translateY(${String(16 * (1 - p))}px)`;
            });
            cursor = s + 0.2;
          }

          // o contorno da logo se desenha ao fundo e sobe devagar (paralaxe)
          const mf = div.querySelector(".marca-fundo");
          if (mf) {
            const tracos = [...mf.querySelectorAll("path")];
            const durM = cena.fim - cena.inicio + cena.tt;
            add((l) => {
              const p = inOutCubic(faixa(l, 0.05, 2.6));
              tracos.forEach((pp, k) => risca(pp, c01(p * 1.15 - k * 0.15)));
              mf.style.transform = `translateY(${String(-70 * c01((l + cena.tt) / durM))}px)`;
            });
          }

          // foto de fundo: aproxima devagar; no gancho, afasta — o "respiro"
          const img = div.querySelector(".foto-cena img");
          if (img) {
            const brilho = div.querySelector(".brilho");
            const dur = cena.fim - cena.inicio + cena.tt;
            const fora = gancho || cena.cfg.zoom === "fora";
            add((l) => {
              const z = c01((l + cena.tt) / dur);
              /* No gancho a câmera ASSENTA: começa bem perto e recua rápido,
                 em curva exponencial, junto com a palavra do impacto. */
              const esc = gancho
                ? 1.06 + 0.06 * (1 - z) + 0.26 * (1 - outExpo(faixa(l, 0, 1.5)))
                : fora
                  ? 1.16 - 0.12 * outCubic(z)
                  : 1.03 + 0.09 * z;
              const q = enquadrar(l);
              /* O reenquadramento vem ANTES da escala na cadeia, para o
                 deslocamento valer em fração do quadro e não da foto já
                 ampliada — senão um mesmo dx move mais numa cena apertada
                 do que numa aberta, e os cortes perdem a unidade. */
              img.style.transform =
                `translate(${String(q.dx)}%, ${String(q.dy)}%) ` +
                `scale(${String(esc * q.esc)}) translateY(${String((fora ? -14 : 10) * z)}px)`;
              if (brilho)
                brilho.style.transform = `translateX(${String(-100 + 200 * inOutCubic(faixa(l, 0.35, 1.3)))}%)`;
            });
          }

          cena.pronto = Math.max(cursor, fimTitulo);
          // O tempo util acaba quando a PROXIMA cena comeca a cobrir esta.
          const prox = cenas[cena.i + 1];
          const folga = cena.fim - (prox ? prox.tt : 0) - cena.inicio - cena.pronto;
          if (folga < 1.0) {
            avisos.push(
              `cena ${String(cena.i + 1)} termina de entrar a ${String(folga.toFixed(2))}s do corte — pouco tempo de leitura`,
            );
          }
          // a ilustração tem um desfecho (a coroa assenta, o visto aparece):
          // cortar antes dele é perder a melhor parte da cena
          if (cena.fimGrafico !== undefined) {
            const util = cena.fim - (prox ? prox.tt : 0) - cena.inicio;
            if (cena.fimGrafico > util + 0.05)
              avisos.push(
                `cena ${String(cena.i + 1)}: a ilustração termina ${(cena.fimGrafico - util).toFixed(2)}s depois do corte`,
              );
          }
          div.style.visibility = "hidden";
        }

        // eventos de transição para a trilha
        for (const c of cenas) {
          if (c.transicao === "arco") eventos.push({ t: c.inicio - c.tt, tipo: "arco", dur: c.tt });
          else if (c.transicao === "corte") eventos.push({ t: c.inicio, tipo: "tick" });
          else if (c.transicao !== "nenhuma")
            eventos.push({ t: c.inicio - c.tt, tipo: "whoosh", dur: c.tt });
        }
        const cta = cenas.find((c) => c.tipo === "cta");

        ESTADO = {
          cenas,
          duracao: relogio,
          ass,
          anel,
          cta,
        };

        /* O RITMO, EM NÚMERO. Quantas vezes a imagem muda — corte de cena
           mais sub-corte — e de quanto em quanto tempo. É o que transforma
           "troque a cada 1,5 a 3 s" de intenção em algo conferível. */
        const batidas = cenas.length + cenas.reduce((n, c) => n + (c.subcortes?.length ?? 0), 0);
        return {
          batidas,
          ritmo: relogio / batidas,
          duracao: relogio,
          cenas: cenas.length,
          eventos: eventos.sort((a, b) => a.t - b.t),
          drop: cenas[1] ? cenas[1].inicio : 2.5,
          cta: cta ? cta.inicio : relogio - 4,
          avisos,
        };
      };

      /* ================================================================
         QUADRO — o palco no instante t. Função pura do tempo.
         ================================================================ */
      window.quadro = (t) => {
        const S = ESTADO;
        let topo = null;
        let anelVisivel = false;

        for (let i = 0; i < S.cenas.length; i += 1) {
          const c = S.cenas[i];
          const prox = S.cenas[i + 1];
          const vis = t >= c.inicio - c.tt && t < c.fim;
          if (!vis) {
            c.div.style.visibility = "hidden";
            continue;
          }
          c.div.style.visibility = "visible";
          const l = t - c.inicio;

          /* ENTRADA desta cena (pe = 0..1). Três formas, uma por transição.
             Nada aqui lê o quadro anterior: clip, deslocamento e opacidade
             são recalculados do zero a cada t. */
          const pe = c.tt > 0 ? faixa(t, c.inicio - c.tt, c.tt) : 1;
          const qe = inOutCubic(pe);
          let clip = "none";
          let ty = 0;
          let opac = 1;
          let esc = 1;
          let raio = 0;
          let raioTopo = 0;
          if (c.transicao === "arco" && pe < 1) {
            const r = 2380 * qe;
            clip = `circle(${String(r)}px at 540px 2266px)`;
            if (pe > 0) {
              anelVisivel = true;
              S.anel.style.width = `${String(2 * r)}px`;
              S.anel.style.height = `${String(2 * r)}px`;
              S.anel.style.left = `${String(540 - r)}px`;
              S.anel.style.top = `${String(2266 - r)}px`;
              S.anel.style.opacity = String(Math.min(1, (1 - pe) * 3));
            }
          } else if (c.transicao === "empurra") {
            // a cena nova sobe como um cartão: cantos de cima arredondados
            // que se endireitam quando ela assenta
            ty += 100 * (1 - qe);
            if (pe < 1) raioTopo = 72 * (1 - qe);
          } else if (c.transicao === "dissolve") {
            opac = outCubic(pe);
          } else if (c.transicao === "lente" && pe < 1) {
            /* LENTE: a cena nova abre num círculo centrado na ilustração.
               Serve para a cena que EXPLICA: o olho já entra apontado para
               onde o desenho vai acontecer. */
            clip = `circle(${String(2180 * qe)}px at 540px 940px)`;
          } else if (c.transicao === "cortina" && pe < 1) {
            /* CORTINA: varredura da esquerda para a direita, na direção da
               leitura. É a transição de COMPARAÇÃO — a segunda opção entra
               empurrando a primeira para fora do campo. */
            clip = `inset(0 ${String(100 * (1 - qe))}% 0 0)`;
          }

          /* SAÍDA — PROFUNDIDADE: quando a próxima cena começa a entrar, esta
             RECUA como um cartão (escala, cantos arredondados, sombra), e o
             verde mais fundo do palco aparece em volta. A nova passa por cima
             de uma cena que se afasta, em vez de só empurrá-la. */
          let sombra = 0;
          if (prox && t >= prox.inicio - prox.tt) {
            const ps = inOutCubic(faixa(t, prox.inicio - prox.tt, prox.tt));
            if (prox.transicao === "empurra") {
              ty -= 3 * ps;
              esc = 1 - 0.09 * ps;
              raio = 64 * ps;
              sombra = 0.5 * ps;
            } else if (prox.transicao === "arco") {
              ty -= 2 * ps;
              esc = 1 - 0.05 * ps;
              raio = 44 * ps;
              sombra = 0.32 * ps;
            } else if (prox.transicao === "lente" || prox.transicao === "cortina") {
              esc = 1 - 0.035 * ps;
              sombra = 0.26 * ps;
            } else {
              sombra = 0.2 * ps;
            }
          }
          if (clip === "none" && raio > 0.5) clip = `inset(0 round ${String(raio)}px)`;
          else if (clip === "none" && raioTopo > 0.5)
            clip = `inset(0 round ${String(raioTopo)}px ${String(raioTopo)}px 0 0)`;
          c.div.style.clipPath = clip;
          c.div.style.transform =
            ty || esc !== 1 ? `translateY(${String(ty)}%) scale(${String(esc)})` : "";
          c.div.style.opacity = String(opac);
          c.sombra.style.opacity = String(sombra);

          for (const fn of c.anims) fn(l);
          if (pe >= 0.5) topo = c;
        }

        if (!anelVisivel) S.anel.style.opacity = "0";

        // a assinatura segue a superfície que está por cima
        const claro = Boolean(topo && !topo.escura);
        /* So troca o logo quando a superficie MUDA. Atribuir o mesmo `src` a
           cada quadro dispara um pedido novo por quadro — com o servidor em
           no-store, sao 900 requisicoes por video, e a memoria do Chromium
           cresce ate ele cair no meio do lote. */
        if (S.claroAtual !== claro) {
          S.claroAtual = claro;
          S.ass.querySelector("img").src = claro ? LOGO_CLARO : LOGO_ESCURO;
          S.ass.querySelector("span").style.color = claro ? "#095902" : "#E2F0D8";
        }
        /* No cartão final a logo grande assume: a assinatura só sai DEPOIS que
           ela começa a aparecer (a logo do cartão entra 0,1 s após a cena). Antes,
           a assinatura saía durante a transição e sobrava meio segundo sem logo
           nenhuma na tela. */
        const naCta = S.cta ? faixa(t, S.cta.inicio + 0.05, 0.3) : 0;
        S.ass.style.opacity = String(1 - naCta);
      };
    </script>
  </body>
</html>
