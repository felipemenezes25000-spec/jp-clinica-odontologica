<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>JP Social — motor de vídeo</title>
    <link rel="stylesheet" href="/social/instagram/source/templates/sistema.css" />
    <style>
      /* ======================================================================
         MOTOR DE VÍDEO — terceira versão.

         A segunda tinha vocabulário de marca e ainda assim deixava metade do
         vídeo em "texto sobre verde liso". A terceira resolve o meio e o
         começo:

           IMPACTO ..... o primeiro quadro não é uma foto esperando texto: é a
                         palavra-chave do gancho ocupando a tela inteira. Ela
                         segura meio segundo e VOA para o seu lugar na frase,
                         enquanto a câmera assenta sobre a foto.
           ILUSTRAÇÃO .. as cenas do meio ganham motion graphics editoriais em
                         traço de marca: o implante entrando em rosca no osso,
                         o enxerto preenchendo o osso grão a grão, o exame de
                         imagem varrendo e medindo, o protocolo assentando
                         sobre quatro pontos, o esmalte intacto no clareamento.
           SORRISO ..... o sublinhado da palavra-chave é a curva do sorriso
                         desenhada, e o contorno da logo se desenha, enorme,
                         no fundo das cenas lisas.
           PROFUNDIDADE  a cena que sai recua como um cartão, de cantos
                         arredondados, e a nova sobe por cima dela.
           RODA ........ número não conta: rola, dígito a dígito, como odômetro.
           DECISÃO ..... o cartão final mostra a prova (nota e anos) junto do
                         WhatsApp, e um toque pulsa no botão.

         O resto do vocabulário vem da segunda versão:

           ARCO ........ a transição principal é a curva do sorriso da logo
                         da JP, crescendo de baixo para cima, com um filete
                         verde vivo na borda. Duas vezes por vídeo: na virada
                         depois do gancho e na entrada do cartão final.
           PALAVRA ..... a headline sobe palavra por palavra de trás de uma
                         máscara; a palavra-chave acende em verde e ganha
                         sublinhado depois que a frase está inteira.
           CONTADOR .... número não aparece: ele conta. 24 anos, 4,6, 192.
           LINHA ....... etapa não é lista: é um trilho que se desenha e acende
                         cada estação quando passa por ela.
           GENTE ....... a equipe real sobe para dentro do arco menta, com nome
                         e registro.
           PINO ........ localização cai no mapa da fachada e pulsa.

         O que continua proibido (§39 do briefing): glitch, neon, explosão,
         letra pulando sem motivo, giro. Todo movimento aqui entra por máscara,
         deslize ou escala menor que 8%, com curva de desaceleração.

         O MOTOR É UMA FUNÇÃO PURA DO TEMPO. `quadro(t)` põe o palco no instante
         t sem ler nada do quadro anterior. É isso que permite capturar a 30 fps
         quadro a quadro e ter o mesmo resultado em qualquer máquina.
      ====================================================================== */
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      /* O fundo do palco só aparece atrás de uma cena que recua: um verde
         mais fundo que o da superfície, para o recuo ler como profundidade. */
      #palco {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #011800;
      }
      .cena {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        transform-origin: 50% 42%;
        will-change: clip-path, transform, opacity;
      }
      .cena.escura {
        background: #032f01;
      }
      .cena.clara {
        background: var(--cream);
      }
      .sombra {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        z-index: 20;
        pointer-events: none;
      }

      /* A ÁREA SEGURA DO REEL. Em cima moram nome do perfil e áudio; embaixo,
         legenda, curtir e navegação. 470px de pé é o que impede a última linha
         de nascer atrás do "…mais". */
      .conteudo {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 34px;
        padding: 290px 96px 470px;
      }
      .conteudo.centro {
        justify-content: center;
      }

      .foto-cena {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .foto-cena img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 42%;
        will-change: transform;
      }
      .veu {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(3, 47, 1, 0.95) 0%,
          rgba(3, 47, 1, 0.9) 38%,
          rgba(3, 47, 1, 0.74) 58%,
          rgba(3, 47, 1, 0.34) 80%,
          rgba(3, 47, 1, 0.46) 100%
        );
      }
      /* Faixa de luz que atravessa a foto do gancho uma vez. Opacidade baixa:
         é percepção de acabamento, não efeito. */
      .brilho {
        position: absolute;
        inset: -10% -40%;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          105deg,
          transparent 40%,
          rgba(255, 255, 255, 0.13) 50%,
          transparent 60%
        );
        transform: translateX(-100%);
      }

      /* ---------------------------------------------------------------- CHIP */
      .vchip {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 18px 30px 18px 26px;
        border-radius: 999px;
        font-family: var(--sans);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1;
      }
      .vchip i {
        width: 15px;
        height: 15px;
        border-radius: 999px;
        background: var(--lime);
        flex: none;
      }
      .escura .vchip {
        background: rgba(86, 168, 5, 0.22);
        color: #cfe9b4;
      }
      .clara .vchip {
        background: var(--mint);
        color: var(--forest);
      }

      /* ------------------------------------------------- HEADLINE CINÉTICA */
      .vh {
        font-family: var(--display);
        font-weight: 800;
        letter-spacing: -0.026em;
        line-height: 1.02;
        margin: 0;
      }
      .v-xg {
        font-size: 138px;
        line-height: 0.98;
      }
      .v-g {
        font-size: 112px;
      }
      .v-m {
        font-size: 90px;
      }
      .v-p {
        font-size: 72px;
        line-height: 1.06;
      }
      /* Cada palavra numa janela com overflow escondido: a palavra sobe de
         trás da própria linha de base. O padding de baixo abre espaço para
         descendente e para o sublinhado sem cortar o "g" e o "ç". */
      .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        padding: 0 0.02em 0.24em;
        margin-bottom: -0.24em;
      }
      .wi {
        display: inline-block;
        will-change: transform;
      }
      .k {
        position: relative;
        display: inline-block;
      }
      /* O SUBLINHADO É O SORRISO. A curva da onda da logo da JP, desenhada
         da esquerda para a direita embaixo da palavra-chave. Traço de largura
         fixa na tela (non-scaling-stroke), para a curva não engordar nas
         palavras longas. */
      .k .sub {
        position: absolute;
        left: -0.03em;
        width: calc(100% + 0.06em);
        bottom: -0.2em;
        height: 0.26em;
        overflow: visible;
        z-index: -1;
      }
      .k .sub path {
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .escura .k .sub path {
        stroke: #56a805;
        stroke-width: 0.075em;
      }
      .clara .k .sub path {
        stroke: rgba(86, 168, 5, 0.6);
        stroke-width: 0.1em;
      }

      /* A palavra do impacto: um clone da palavra-chave do gancho, fora da
         frase, que começa gigante no centro e pousa no lugar da original. */
      .heroi {
        position: absolute;
        z-index: 8;
        margin: 0;
        white-space: nowrap;
        transform-origin: 0 0;
        pointer-events: none;
        will-change: transform;
      }

      /* Véu da palavra do impacto: escurece a foto só atrás dela e só
         enquanto ela está gigante. É a regra do véu aplicada ao impacto —
         a palavra não pode depender do letreiro que está atrás. */
      .escrim {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        background: radial-gradient(
          ellipse 78% 30% at 50% 44%,
          rgba(3, 47, 1, 0.78) 0%,
          rgba(3, 47, 1, 0.5) 55%,
          rgba(3, 47, 1, 0) 100%
        );
      }

      /* O contorno da logo, enorme, atrás das cenas lisas. */
      /* A logo tem 215 × 74 unidades; desenhada com 2300 px de largura, a onda
         atravessa a tela inteira e o dente fica meio para fora, à esquerda. */
      .marca-fundo {
        position: absolute;
        z-index: 1;
        width: 2300px;
        height: 790px;
        left: -420px;
        top: 1010px;
        overflow: visible;
        pointer-events: none;
      }
      .marca-fundo svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .marca-fundo.esq {
        left: -1260px;
        top: 120px;
      }
      /* 0,23 unidade da logo ≈ 2,5 px na tela (215 unidades em 2300 px). */
      .marca-fundo path {
        fill: none;
        stroke-width: 0.23;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .escura .marca-fundo path {
        stroke: rgba(142, 222, 46, 0.2);
      }
      .clara .marca-fundo path {
        stroke: rgba(9, 89, 2, 0.13);
      }

      /* ---------------------------------------------------- ILUSTRAÇÃO */
      .grafico {
        position: relative;
        width: 100%;
        flex: none;
      }
      .grafico svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .escura .grafico {
        --gl: #8ede2e;
        --gl2: rgba(142, 222, 46, 0.42);
        --gl3: rgba(142, 222, 46, 0.16);
        --gf: rgba(142, 222, 46, 0.09);
        --gg: rgba(142, 222, 46, 0.2);
        --gs: #f6faf2;
        --gtx: #cfe9b4;
        --gbg: #032f01;
        --gti: #c7d6c1;
        --gtr: rgba(3, 47, 1, 0.6);
      }
      .clara .grafico {
        --gl: #095902;
        --gl2: rgba(9, 89, 2, 0.4);
        --gl3: rgba(9, 89, 2, 0.14);
        --gf: rgba(86, 168, 5, 0.1);
        --gg: rgba(86, 168, 5, 0.22);
        --gs: #ffffff;
        --gtx: #3f7a17;
        --gbg: #f7f8f2;
        --gti: #b5c6ae;
        --gtr: rgba(3, 47, 1, 0.45);
      }
      .grafico .t {
        fill: none;
        stroke: var(--gl);
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .grafico .t2 {
        fill: none;
        stroke: var(--gl2);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .grafico .t3 {
        fill: none;
        stroke: var(--gl3);
        stroke-width: 2;
      }
      .grafico .d {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .grafico .tr {
        fill: none;
        stroke: var(--gl2);
        stroke-width: 3.5;
        stroke-dasharray: 12 10;
        stroke-linecap: round;
      }
      .grafico .f {
        fill: var(--gf);
      }
      .grafico .fg {
        fill: var(--gg);
      }
      .grafico .fs {
        fill: var(--gs);
      }
      .grafico .ft {
        fill: var(--gti);
      }
      .grafico .pt {
        fill: var(--gl2);
      }
      .grafico .rosca {
        fill: none;
        stroke: var(--gtr);
        stroke-width: 5;
        stroke-linecap: round;
      }
      .grafico .tx {
        font-family: var(--sans);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.14em;
        fill: var(--gtx);
      }
      .grafico .ano {
        font-family: var(--display);
        font-weight: 800;
        font-size: 76px;
        letter-spacing: -0.03em;
        fill: var(--gs);
      }
      .grafico .aspa {
        font-family: var(--display);
        font-weight: 800;
        font-size: 560px;
        fill: #56a805;
      }
      .grafico .peca {
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .grafico .centro {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* A palavra da legenda. Ela nasce invisível e um pouco abaixo; o
         motor acende cada uma no instante em que a voz a diz. `.pw.dita`
         é a que está sendo falada AGORA — meio tom mais clara, sem escala:
         palavra que salta de tamanho embola a leitura e é o clichê que o
         briefing chama de "Canva animado". */
      .vp .pw {
        display: inline-block;
        opacity: 0;
        will-change: opacity, transform, color;
      }
      .vp .pw.dita {
        color: #eaf7db;
      }
      .clara .vp .pw.dita {
        color: #06400a;
      }

      /* ------------------------------------------------------ ODÔMETRO */
      .dg {
        display: inline-block;
        height: 0.86em;
        overflow: hidden;
        vertical-align: top;
      }
      .dg .col {
        display: flex;
        flex-direction: column;
        will-change: transform;
      }
      .dg .col b {
        display: block;
        height: 0.86em;
        line-height: 0.86em;
        font-weight: inherit;
      }
      .sep {
        display: inline-block;
      }

      /* ---------------------------------------------- PROVA E TOQUE (CTA) */
      .prova {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: var(--sans);
        font-weight: 650;
        font-size: 33px;
        line-height: 1.2;
      }
      .prova svg {
        width: 38px;
        height: 38px;
        flex: none;
      }
      .clara .prova {
        color: #2f4a2b;
      }
      .escura .prova {
        color: #e2f0d8;
      }
      .prova .ponto {
        opacity: 0.45;
      }
      .toque {
        position: absolute;
        z-index: 9;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        border-radius: 50%;
        border: 5px solid #56a805;
        opacity: 0;
        pointer-events: none;
      }

      .vp {
        font-family: var(--sans);
        font-weight: 450;
        font-size: 44px;
        line-height: 1.38;
        max-width: 22ch;
        margin: 0;
      }
      .escura .vp {
        color: #d5e6ce;
      }
      .escura.com-foto .vp {
        color: #e6f1df;
      }
      .clara .vp {
        color: #5a6b5c;
      }
      .vp .vivo {
        color: #8ede2e;
      }
      .clara .vp .vivo {
        color: var(--forest);
        font-weight: 650;
      }

      /* ---------------------------------------------------------- LISTA */
      .lista {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .item {
        display: flex;
        align-items: flex-start;
        gap: 26px;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 44px;
        line-height: 1.32;
      }
      .escura .item {
        color: #e4f0dc;
      }
      .clara .item {
        color: #172018;
      }
      .chk {
        flex: none;
        width: 58px;
        height: 58px;
        margin-top: 2px;
      }
      .chk circle {
        fill: rgba(86, 168, 5, 0);
        stroke: #56a805;
        stroke-width: 3.5;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .chk path {
        fill: none;
        stroke: #8ede2e;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .clara .chk path {
        stroke: #095902;
      }

      /* -------------------------------------------------------- ETAPAS */
      .etapas {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .trilho {
        position: absolute;
        left: 30px;
        width: 5px;
        border-radius: 999px;
        background: rgba(86, 168, 5, 0.22);
        overflow: hidden;
      }
      .trilho i {
        display: block;
        width: 100%;
        height: 0;
        background: #56a805;
      }
      .etapa {
        display: flex;
        align-items: flex-start;
        gap: 32px;
        position: relative;
        z-index: 1;
      }
      .no {
        flex: none;
        width: 66px;
        height: 66px;
        border-radius: 999px;
        border: 4px solid rgba(86, 168, 5, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--display);
        font-weight: 800;
        font-size: 30px;
      }
      .escura .no {
        background: #032f01;
        color: #9fbf93;
      }
      .clara .no {
        background: var(--cream);
        color: #6f8a68;
      }
      .etapa h4 {
        margin: 6px 0 6px;
        font-family: var(--display);
        font-weight: 800;
        font-size: 50px;
        line-height: 1.08;
        letter-spacing: -0.015em;
      }
      .escura .etapa h4 {
        color: #f4f9ef;
      }
      .clara .etapa h4 {
        color: var(--forest);
      }
      .etapa p {
        margin: 0;
        font-family: var(--sans);
        font-size: 34px;
        line-height: 1.36;
      }
      .escura .etapa p {
        color: #c9dcc2;
      }
      .clara .etapa p {
        color: #5a6b5c;
      }

      /* ------------------------------------------------------- COMPARAR */
      .comp {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .card {
        border-radius: 36px;
        padding: 42px 46px;
      }
      .escura .card {
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(207, 233, 180, 0.18);
      }
      .clara .card {
        background: var(--paper);
        border: 2px solid var(--border);
      }
      .card .rot {
        display: block;
        font-family: var(--sans);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .escura .card .rot {
        color: #8ede2e;
      }
      .clara .card .rot {
        color: #3f7a17;
      }
      .card h4 {
        margin: 0 0 14px;
        font-family: var(--display);
        font-weight: 800;
        font-size: 66px;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }
      .escura .card h4 {
        color: #f4f9ef;
      }
      .clara .card h4 {
        color: var(--forest);
      }
      .card p {
        margin: 0;
        font-family: var(--sans);
        font-size: 36px;
        line-height: 1.38;
      }
      .escura .card p {
        color: #cfe0c8;
      }
      .clara .card p {
        color: #5a6b5c;
      }
      .versus {
        align-self: center;
        width: 96px;
        height: 96px;
        margin: -26px 0;
        border-radius: 999px;
        background: #56a805;
        color: #032f01;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--display);
        font-weight: 800;
        font-size: 54px;
        position: relative;
        z-index: 2;
        box-shadow: 0 0 0 10px #032f01;
      }
      .clara .versus {
        box-shadow: 0 0 0 10px var(--cream);
      }

      /* ------------------------------------------------------- NÚMEROS */
      .stats {
        display: flex;
        flex-direction: column;
        gap: 46px;
      }
      .stat .num {
        font-family: var(--display);
        font-weight: 800;
        font-size: 190px;
        line-height: 0.86;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: baseline;
        gap: 22px;
      }
      .stats.unico .stat .num {
        font-size: 280px;
      }
      .stat .num small {
        font-size: 64px;
        letter-spacing: -0.02em;
      }
      .escura .stat .num {
        color: #f4f9ef;
      }
      .escura .stat .num small {
        color: #8ede2e;
      }
      .clara .stat .num {
        color: var(--forest);
      }
      .clara .stat .num small {
        color: #3f7a17;
      }
      .stat .rot {
        margin-top: 12px;
        font-family: var(--sans);
        font-size: 40px;
        line-height: 1.3;
      }
      .escura .stat .rot {
        color: #cfe0c8;
      }
      .clara .stat .rot {
        color: #5a6b5c;
      }
      .vestrelas {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }
      .vestrelas svg {
        width: 66px;
        height: 66px;
      }

      /* -------------------------------------------------------- PESSOAS */
      .pessoas {
        display: grid;
        gap: 34px 30px;
      }
      .pessoas.n2,
      .pessoas.n4 {
        grid-template-columns: 1fr 1fr;
      }
      .pessoas.n3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .pessoas.n1 {
        grid-template-columns: 1fr;
      }
      .pp {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .moldura {
        position: relative;
        height: 400px;
      }
      .pessoas.n3 .moldura {
        height: 340px;
      }
      .pessoas.n4 .moldura {
        height: 270px;
      }
      .pessoas.n1 .moldura {
        height: 640px;

  <body>
    <div id="palco"></div>

    <script type="module">
      const palco = document.getElementById("palco");
      /* A logo é SEMPRE a logo inteira — JP, "Clínica Odontológica" e a onda
         (decisão da clínica, 18/09/2026). A de fundo escuro é a mesma arte com
         o verde-floresta trocado por branco, que ali não some. */
      const LOGO_CLARO = "/src/assets/marca/logo-jp.svg";
      const LOGO_ESCURO = "/src/assets/marca/logo-jp-claro.svg";

      /* ------------------------------------------------------ utilitários */
      const e = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const rico = (s) =>
        e(s)
          .replace(/\[\[([\s\S]+?)\]\]/g, '<span class="vivo">$1</span>')
          .replace(/\n/g, "<br>");
      const c01 = (x) => Math.min(1, Math.max(0, x));
      const faixa = (l, ini, dur) => c01((l - ini) / dur);
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const outQuart = (x) => 1 - Math.pow(1 - x, 4);
      const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      /* Leve sobra no fim, para peça que "assenta" — pílula, pino. 1,7 dá cerca
         de 5% de ultrapassagem: sente-se, não se vê pular. */
      const outBack = (x) => {
        const c1 = 1.7;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      const mix = (a, b, p) => a.map((v, i) => Math.round(v + (b[i] - v) * p));
      const rgb = (a) => `rgb(${a.join(",")})`;
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      /* Saída exponencial: rápida no começo, pousa longa. É a curva do
         movimento de câmera e da palavra que voa — o que separa "animado" de
         "filmado". */
      const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const risca = (el, p) => {
        el.style.strokeDashoffset = String(1 - p);
      };
      /** Pseudoaleatório com semente: o mesmo vídeo sempre com os mesmos grãos. */
      const semeado = (sem) => {
        let x = sem >>> 0 || 1;
        return () => {
          x ^= x << 13;
          x >>>= 0;
          x ^= x >> 17;
          x ^= x << 5;
          x >>>= 0;
          return x / 4294967296;
        };
      };

      /* ================================================================
         ILUSTRAÇÕES — motion graphics editoriais, em traço de marca.

         Todas desenham num quadro de 888 px de largura (a coluna de texto)
         e compartilham o mesmo CORTE: osso, gengiva e os dois dentes
         vizinhos, vistos de lado. É um desenho de consultório, não um
         render: duas cores, traço redondo, nada de brilho ou 3D.
         Cada uma devolve { h, svg, anima(raiz, add, s, ev) }.
         ================================================================ */
      const G = {
        cristaNormal: "M 40 318 C 170 300, 300 304, 444 302 C 588 300, 718 300, 848 318",
        cristaVolta: "L 848 318 C 718 300, 588 300, 444 302 C 300 304, 170 300, 40 318 Z",
        cristaDefeito:
          "M 40 318 C 170 300, 300 304, 330 306 C 360 318, 380 392, 444 396 C 508 392, 528 318, 558 306 C 588 300, 718 300, 848 318",
        ideal: "M 330 306 C 380 303, 508 303, 558 306",
        vazio:
          "M 330 306 C 380 303, 508 303, 558 306 C 528 318, 508 392, 444 396 C 380 392, 360 318, 330 306 Z",
        gengiva:
          "M 40 262 C 120 250, 210 246, 300 258 C 360 268, 392 296, 444 298 C 496 296, 528 268, 588 258 C 678 246, 768 250, 848 262",
        coroaE:
          "M 106 262 C 96 200, 90 128, 114 94 C 138 62, 218 62, 242 94 C 266 128, 260 200, 250 262 Z",
        raizE:
          "M 106 262 C 114 340, 134 420, 164 470 C 172 484, 186 484, 194 470 C 222 420, 242 340, 250 262",
        coroaD:
          "M 782 262 C 792 200, 798 128, 774 94 C 750 62, 670 62, 646 94 C 622 128, 628 200, 638 262 Z",
        raizD:
          "M 782 262 C 774 340, 754 420, 724 470 C 716 484, 702 484, 694 470 C 666 420, 646 340, 638 262",
        implante: "M 408 300 L 480 300 L 468 476 C 466 492, 422 492, 420 476 Z",
        pilar: "M 424 301 L 464 301 L 457 262 L 431 262 Z",
        coroa:
          "M 372 262 C 362 200, 356 128, 380 94 C 404 62, 484 62, 508 94 C 532 128, 526 200, 516 262 Z",
      };
      const profDefeito = (x) => 304 + 92 * Math.cos(((x - 444) / 114) * (Math.PI / 2)) ** 2;

      function pontosOsso(o) {
        const rnd = semeado(o.semente ?? 11);
        const lista = [];
        for (let y = 336; y < 532; y += 25) {
          for (let x = 58; x < 836; x += 29) {
            const px = x + (rnd() - 0.5) * 16;
            const py = y + (rnd() - 0.5) * 14;
            const dx = px - 444;
            let crista = 322;
            if (o.defeito && Math.abs(dx) < 114) crista = profDefeito(px) + 8;
            if (py < crista + 10) continue;
            if (py < 488 && ((px > 100 && px < 256) || (px > 632 && px < 788))) continue;
            if (py < 502 && Math.abs(dx) < 52) continue;
            lista.push({
              x: px,
              y: py,
              r: 3 + rnd() * 1.9,
              dist: Math.hypot(dx, (py - 400) * 1.4),
            });
          }
        }
        return lista;
      }

      /** O corte: osso pontilhado, raízes, crista, gengiva e as duas coroas
       *  vizinhas. `miolo` entra entre o osso e a gengiva — é onde o implante
       *  passa. `estatico` desenha tudo pronto (a tomografia revela de outro
       *  jeito). */
      function svgCorte(o, miolo = "") {
        const crista = o.defeito ? G.cristaDefeito : G.cristaNormal;
        const pts = pontosOsso(o);
        o.pts = pts;
        const d = o.estatico ? "" : " d";
        const pl = o.estatico ? "" : ' pathLength="1"';
        const viz = o.vizinhos !== false;
        /* O corte não termina em retângulo: esvai nas laterais e embaixo,
           como ilustração de livro — o osso continua, a gente só olha um
           trecho dele. Duas máscaras, uma dentro da outra. */
        nCorte += 1;
        const id = `c${String(nCorte)}`;
        const esvai = `<defs>
            <linearGradient id="gh-${id}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".07" stop-color="#fff"/><stop offset=".93" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
            <linearGradient id="gv-${id}" x1="0" x2="0" y1="0" y2="1"><stop offset=".7" stop-color="#fff"/><stop offset=".92" stop-color="#000"/></linearGradient>
            <mask id="mh-${id}" maskUnits="userSpaceOnUse" x="0" y="-100" width="888" height="700"><rect x="0" y="-100" width="888" height="700" fill="url(#gh-${id})"/></mask>
            <mask id="mv-${id}" maskUnits="userSpaceOnUse" x="0" y="-100" width="888" height="700"><rect x="0" y="-100" width="888" height="700" fill="url(#gv-${id})"/></mask>
          </defs>`;
        return `${esvai}<g mask="url(#mh-${id})"><g mask="url(#mv-${id})">
          <path class="f osso" d="${crista} L 848 540 L 40 540 Z"/>
          <g class="pontos">${pts.map((p) => `<circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}"/>`).join("")}</g>
          ${viz ? `<path class="f raiz-f" d="${G.raizE} Z"/><path class="f raiz-f" d="${G.raizD} Z"/><path class="t2${d} raiz"${pl} d="${G.raizE}"/><path class="t2${d} raiz"${pl} d="${G.raizD}"/>` : ""}
          <path class="t${d} crista"${pl} d="${crista}"/>
          ${o.defeito ? `<path class="fg enchido" d="${G.vazio}"/><g class="graos"></g><path class="tr ideal" d="${G.ideal}"/><path class="t d ideal-ok" pathLength="1" d="${G.ideal}"/>` : ""}
          ${miolo}
          <path class="fg gengiva-f" d="${G.gengiva} ${G.cristaVolta}"/>
          <path class="t${d} gengiva"${pl} d="${G.gengiva}"/>
          ${viz ? `<path class="fs coroa-v" d="${G.coroaE}"/><path class="fs coroa-v" d="${G.coroaD}"/><path class="t${d} coroa-l"${pl} d="${G.coroaE}"/><path class="t${d} coroa-l"${pl} d="${G.coroaD}"/>` : ""}</g></g>`;
      }
      let nCorte = 0;

      /** Implante com as roscas presas num recorte do corpo: quando o grupo
       *  das roscas desliza dentro do corpo, o parafuso parece girar. */
      function svgImplante(id, comCoroa = true) {
        const roscas = [];
        for (let y = 279; y <= 520; y += 17)
          roscas.push(`<path class="rosca" d="M 396 ${String(y)} L 492 ${String(y + 11)}"/>`);
        return `
          <defs><clipPath id="corpo-${id}"><path d="${G.implante}"/></clipPath></defs>
          <g class="impl">
            <path class="ft" d="${G.implante}"/>
            <g clip-path="url(#corpo-${id})"><g class="roscas">${roscas.join("")}</g></g>
            <path class="t2" d="${G.implante}"/>
          </g>
          <g class="pilar-g peca"><path class="ft" d="${G.pilar}"/><path class="t2" d="${G.pilar}"/></g>
          ${comCoroa ? `<g class="coroa-g"><path class="fs" d="${G.coroa}"/><path class="t" d="${G.coroa}"/></g><ellipse class="t anel-c centro" cx="444" cy="170" rx="150" ry="118" style="opacity:0"/>` : ""}`;
      }

      /** O corte se desenha: crista e gengiva, depois os vizinhos. */
      function animaCorte(raiz, add, s, ev) {
        const osso = raiz.querySelector(".osso");
        const pontos = raiz.querySelector(".pontos");
        const crista = raiz.querySelector(".crista");
        const gengiva = raiz.querySelector(".gengiva");
        const gengivaF = raiz.querySelector(".gengiva-f");
        const raizes = [...raiz.querySelectorAll(".raiz")];
        const raizesF = [...raiz.querySelectorAll(".raiz-f")];
        const coroasL = [...raiz.querySelectorAll(".coroa-l")];
        const coroasF = [...raiz.querySelectorAll(".coroa-v")];
        add((l) => {
          risca(crista, outCubic(faixa(l, s, 0.7)));
          osso.style.opacity = String(outCubic(faixa(l, s + 0.1, 0.6)));
          pontos.style.opacity = String(outCubic(faixa(l, s + 0.3, 0.6)));
          risca(gengiva, outCubic(faixa(l, s + 0.15, 0.7)));
          gengivaF.style.opacity = String(outCubic(faixa(l, s + 0.35, 0.5)));
          raizes.forEach((r) => risca(r, outCubic(faixa(l, s + 0.3, 0.7))));
          raizesF.forEach((r) => (r.style.opacity = String(outCubic(faixa(l, s + 0.5, 0.5)))));
          coroasL.forEach((r) => risca(r, outCubic(faixa(l, s + 0.25, 0.7))));
          coroasF.forEach((r) => (r.style.opacity = String(outCubic(faixa(l, s + 0.6, 0.4)))));
        });
        ev(s, "risco");
        return s + 1.0;
      }

      /** O implante desce em rosca, o pilar sobe, a coroa assenta, o anel pulsa. */
      function animaImplante(raiz, add, s, ev, rapido = false) {
        const impl = raiz.querySelector(".impl");
        const roscas = raiz.querySelector(".roscas");
        const pilar = raiz.querySelector(".pilar-g");
        const coroa = raiz.querySelector(".coroa-g");
        const anelC = raiz.querySelector(".anel-c");
        const desce = rapido ? 0.85 : 1.1;
        add((l) => {
          const p = faixa(l, s, desce);
          const q = outCubic(p);
          impl.style.opacity = String(c01(p * 7));
          impl.style.transform = `translateY(${String(-330 * (1 - q))}px)`;
          roscas.style.transform = `translateY(${String(-17 * ((q * 9) % 1))}px)`;
          const pp = outCubic(faixa(l, s + desce + 0.02, 0.28));
          pilar.style.opacity = String(pp);
          pilar.style.transform = `scaleY(${String(0.15 + 0.85 * pp)})`;
          if (coroa) {
            const pc = faixa(l, s + desce + 0.28, 0.5);
            coroa.style.opacity = String(c01(pc * 3));
            coroa.style.transform = `translateY(${String(-120 * (1 - outBack(pc)))}px)`;
            const pa = faixa(l, s + desce + 0.78, 0.7);
            anelC.style.opacity = String(pa > 0 && pa < 1 ? 0.75 * (1 - pa) : 0);
            anelC.style.transform = `scale(${String(0.92 + 0.36 * outCubic(pa))})`;
          }
        });
        ev(s, "rosca", { dur: desce });
        if (coroa) ev(s + desce + 0.76, "encaixe");
        else ev(s + desce + 0.2, "encaixe");
        return s + desce + (coroa ? 0.8 : 0.3);
      }

      function rotulo(x1, y1, x2, y2, texto, lado) {
        const tx = lado === "esq" ? x2 - 12 : x2 + 12;
        return `<g class="rot"><circle class="pt" cx="${String(x1)}" cy="${String(y1)}" r="7"/><path class="t2 d" pathLength="1" d="M ${String(x1)} ${String(y1)} L ${String(x2)} ${String(y2)}"/><text class="tx" x="${String(tx)}" y="${String(y2 + 9)}" text-anchor="${lado === "esq" ? "end" : "start"}">${e(texto.toUpperCase())}</text></g>`;
      }
      function animaRotulo(g, add, s) {
        const linha = g.querySelector("path");
        const txt = g.querySelector("text");
        const ponto = g.querySelector("circle");
        add((l) => {
          ponto.style.opacity = String(outCubic(faixa(l, s, 0.2)));
          risca(linha, outCubic(faixa(l, s + 0.05, 0.4)));
          txt.style.opacity = String(outCubic(faixa(l, s + 0.3, 0.4)));
        });
      }

      function arcoPontos(a, y0, prof, n = 48) {
        const tm = 1.745;
        const pts = [];
        for (let k = 0; k <= n; k += 1) {
          const th = -tm + (2 * tm * k) / n;
          pts.push([444 + a * Math.sin(th), y0 + (prof * (1 - Math.cos(th))) / (1 - Math.cos(tm))]);
        }
        return pts;
      }
      const linhaDe = (pts) =>
        `M ${pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L ")}`;
      const noArco = (th) => {
        const tm = 1.745;
        return [444 + 300 * Math.sin(th), 70 + (400 * (1 - Math.cos(th))) / (1 - Math.cos(tm))];
      };

      /* ================================================================
         UM DENTE VISTO DE CIMA — vocabulário compartilhado.

         Duas ilustrações desenham arcada (a `arcada` e o `protocolo`), e as
         duas caíram no mesmo erro em versões diferentes: enfileirar catorze
         formas IGUAIS ao longo da curva. Uma saiu parecendo colar de pérolas,
         a outra fileira de marshmallow. O defeito não é a curva: é que nenhum
         dente real é redondo visto de cima, e nenhuma arcada tem dentes todos
         do mesmo feitio.

         `FEITIO_DENTE` é indexado pela DISTÂNCIA DO CENTRO da arcada, em
         número de dentes. Zero e um são os incisivos — estreitos e retos na
         borda. Dois é o canino, mais alto. Três e quatro são pré-molares,
         quase quadrados. Cinco em diante são molares: largos, e os únicos
         com sulco, porque são os que mastigam.

         O sulco é o detalhe que mais trabalha. Visto de cima, é ele que
         separa um dente de um seixo.
         ================================================================ */
      const FEITIO_DENTE = [
        { w: 36, h: 47, r: 9, sulco: 0 },
        { w: 35, h: 45, r: 9, sulco: 0 },
        { w: 40, h: 52, r: 17, sulco: 0 },
        { w: 47, h: 47, r: 14, sulco: 1 },
        { w: 50, h: 47, r: 14, sulco: 1 },
        { w: 59, h: 52, r: 16, sulco: 2 },
        { w: 61, h: 52, r: 16, sulco: 2 },
      ];
      /** O feitio do dente que está a `d` dentes do centro da arcada. */
      const feitioDente = (d, escala = 1) => {
        const f = FEITIO_DENTE[Math.min(d, FEITIO_DENTE.length - 1)];
        return {
          w: f.w * escala,
          h: f.h * escala,
          r: f.r * escala,
          sulco: f.sulco,
        };
      };

      /** O dente desenhado em (x,y), girado para acompanhar o arco.
       *  `vazio` troca o dente pelo alvéolo — o lugar dele, tracejado. */
      function svgDenteArco(x, y, graus, f, vazio = false) {
        const g = `rotate(${graus.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})`;
        const cx = (x - f.w / 2).toFixed(1);
        const cy = (y - f.h / 2).toFixed(1);
        const cai = `x="${cx}" y="${cy}" width="${f.w.toFixed(1)}" height="${f.h.toFixed(1)}" rx="${f.r.toFixed(1)}" transform="${g}"`;
        if (vazio) return `<rect class="tr" ${cai}/>`;
        let sulco = "";
        if (f.sulco === 1) {
          sulco = `<path class="t3" d="M ${(x - f.w * 0.26).toFixed(1)} ${y.toFixed(1)} L ${(x + f.w * 0.26).toFixed(1)} ${y.toFixed(1)}" transform="${g}" style="stroke-width:2.6"/>`;
        } else if (f.sulco === 2) {
          sulco =
            `<path class="t3" d="M ${(x - f.w * 0.3).toFixed(1)} ${y.toFixed(1)} L ${(x + f.w * 0.3).toFixed(1)} ${y.toFixed(1)}" transform="${g}" style="stroke-width:2.6"/>` +
            `<path class="t3" d="M ${x.toFixed(1)} ${(y - f.h * 0.26).toFixed(1)} L ${x.toFixed(1)} ${(y + f.h * 0.26).toFixed(1)}" transform="${g}" style="stroke-width:2.6"/>`;
        }
        return `<rect class="fs" ${cai}/><rect class="t3" ${cai}/>${sulco}`;
      }

      /** Distribui os dentes ao longo do arco ENCOSTADOS uns nos outros.
       *
       *  Espaçar por ângulo igual — que é o que as duas ilustrações faziam —
       *  abre vão entre os incisivos e aperta os molares, porque a curva anda
       *  mais depressa no fundo do que na frente. No desenho isso sai como
       *  uma fileira de peças soltas, e foi metade do efeito "colar" que
       *  denunciou a primeira versão.
       *
       *  Aqui o que é igual é o COMPRIMENTO OCUPADO: mede-se o arco, soma-se
       *  a largura dos dentes e eles são postos um ao lado do outro. O fator
       *  `k` estica o conjunto até encher o arco, com teto de 1,3 para um
       *  arco largo demais não produzir dente deformado — se sobrar arco, ele
       *  sobra nas pontas, que é onde ninguém repara.
       */
      function distribuirNoArco(feitios, ponto, thMax, folga = 3) {
        const N = 400;
        const ths = [];
        const acum = [0];
        for (let i = 0; i <= N; i += 1) ths.push(-thMax + (2 * thMax * i) / N);
        for (let i = 1; i <= N; i += 1) {
          const [x0, y0] = ponto(ths[i - 1]);
          const [x1, y1] = ponto(ths[i]);
          acum.push(acum[i - 1] + Math.hypot(x1 - x0, y1 - y0));
        }
        const L = acum[N];
        const W = feitios.reduce((t, f) => t + f.w, 0) + folga * (feitios.length - 1);
        const k = Math.min(1.3, L / W);
        const usado = W * k;
        let s = (L - usado) / 2; // o que sobrar de arco sobra nas duas pontas
        const saida = [];
        for (const f0 of feitios) {
          const f = { w: f0.w * k, h: f0.h * k, r: f0.r * k, sulco: f0.sulco };
          const meio = s + f.w / 2;
          let i = 1;
          while (i < N && acum[i] < meio) i += 1;
          const t = (meio - acum[i - 1]) / Math.max(1e-6, acum[i] - acum[i - 1]);
          const th = ths[i - 1] + (ths[i] - ths[i - 1]) * t;
          const [x, y] = ponto(th);
          saida.push({ th, x, y, f, graus: (th * 180) / Math.PI });
          s += f.w + folga * k;
        }
        return saida;
      }

      /** A MÁSCARA QUE FAZ O CORTE NÃO TERMINAR EM RETÂNGULO.
       *
       *  O corte do implante já nascia com ela — "esvai nas laterais e
       *  embaixo, como ilustração de livro". As ilustrações da segunda leva
       *  não, e o resultado apareceu no vídeo pronto: a gengiva do Reel 13 é
       *  um bloco verde com aresta vertical nas duas pontas, plantado no meio
       *  do quadro. Ilustração de anatomia não tem borda: o tecido continua,
       *  a gente só olha um trecho dele.
       *
       *  Devolve o par de tags para embrulhar o que tem de esvair. */
      let nEsvai = 0;
      function esvaecer(alturaTotal = 560) {
        nEsvai += 1;
        const id = `ev${String(nEsvai)}`;
        const h = String(alturaTotal + 200);
        return {
          abre: `<defs>
              <linearGradient id="gh-${id}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
              <linearGradient id="gv-${id}" x1="0" x2="0" y1="0" y2="1"><stop offset=".72" stop-color="#fff"/><stop offset=".97" stop-color="#000"/></linearGradient>
              <mask id="mh-${id}" maskUnits="userSpaceOnUse" x="0" y="-100" width="888" height="${h}"><rect x="0" y="-100" width="888" height="${h}" fill="url(#gh-${id})"/></mask>
              <mask id="mv-${id}" maskUnits="userSpaceOnUse" x="0" y="-100" width="888" height="${h}"><rect x="0" y="-100" width="888" height="${h}" fill="url(#gv-${id})"/></mask>
            </defs><g mask="url(#mh-${id})"><g mask="url(#mv-${id})">`,
          fecha: `</g></g>`,
        };
      }

      const GRAFICOS = {
        /* O implante, do osso à coroa. modo: "anestesia" (a região acalma
           antes), "juntos" (sem vizinhos, com rótulos implante/prótese). */
        implante: (o) => {
          const juntos = o.modo === "juntos";
          const anest = o.modo === "anestesia";
          const miolo = svgImplante(o.id);
          const extra = anest
            ? `<g class="anest"><ellipse class="fg calma" cx="444" cy="286" rx="200" ry="104"/>${[0, 1, 2].map((k) => `<ellipse class="t2 onda-a centro" cx="444" cy="286" rx="${String(170 + k * 40)}" ry="${String(86 + k * 22)}"/>`).join("")}</g>`
            : "";
          const rotulos = juntos
            ? rotulo(366, 168, 236, 168, "prótese", "esq") +
              rotulo(482, 410, 640, 410, "implante", "dir")
            : "";
          return {
            h: 540,
            svg: `<svg viewBox="0 0 888 540">${extra}${svgCorte({ vizinhos: !juntos }, miolo)}${rotulos}</svg>`,
            anima(raiz, add, s, ev) {
              let t = animaCorte(raiz, add, s, ev);
              if (anest) {
                const calma = raiz.querySelector(".calma");
                const ondas = [...raiz.querySelectorAll(".onda-a")];
                const t0 = t - 0.3;
                add((l) => {
                  calma.style.opacity = String(outCubic(faixa(l, t0, 0.8)));
                  ondas.forEach((on, k) => {
                    const ciclo = faixa(l, t0 + k * 0.22, 1.1);
                    on.style.opacity = String(
                      ciclo > 0 && ciclo < 1 ? 0.9 * Math.sin(Math.PI * ciclo) : 0,
                    );
                    on.style.transform = `scale(${String(1.35 - 0.4 * outCubic(ciclo))})`;
                  });
                });
                ev(t0, "sopro");
                t = t0 + 1.2;
              }
              const fim = animaImplante(raiz, add, t, ev, anest);
              if (juntos) {
                const [r1, r2] = raiz.querySelectorAll(".rot");
                animaRotulo(r2, add, t + 0.9);
                animaRotulo(r1, add, fim - 0.1);
                ev(fim - 0.05, "tick");
              }
              return fim + 0.4;
            },
          };
        },

        /* A maior parte do tempo é de cicatrização: o implante já está no
           osso, o osso se fecha em volta dele ponto a ponto, e a barra do
           tempo mostra que a prótese é o trecho curto do fim. */
        cicatrizacao: (o) => {
          const cfg = { vizinhos: true };
          const miolo = svgImplante(o.id);
          const corte = svgCorte(cfg, miolo);
          return {
            h: 610,
            svg: `<svg viewBox="0 0 888 610">
              <path class="t3" d="M 40 26 L 848 26" style="stroke-width:14;stroke-linecap:round"/>
              <path class="barra-a" d="M 40 26 L 690 26" style="fill:none;stroke:#56A805;stroke-width:14;stroke-linecap:round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <path class="barra-b" d="M 712 26 L 848 26" style="fill:none;stroke:var(--gs);stroke-width:14;stroke-linecap:round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text class="tx rot-a" x="40" y="72">CICATRIZAÇÃO</text>
              <text class="tx rot-b" x="848" y="72" text-anchor="end">PRÓTESE</text>
              <g transform="translate(0 70)">${corte}</g></svg>`,
            anima(raiz, add, s, ev) {
              const t = animaCorte(raiz, add, s, ev);
              const impl = raiz.querySelector(".impl");
              const pilar = raiz.querySelector(".pilar-g");
              const coroa = raiz.querySelector(".coroa-g");
              const anelC = raiz.querySelector(".anel-c");
              const pontos = [...raiz.querySelectorAll(".pt")];
              const perto = cfg.pts
                .map((p, k) => ({ ...p, el: pontos[k] }))
                .filter((p) => p.dist < 190)
                .sort((a, b) => b.dist - a.dist);
              const barraA = raiz.querySelector(".barra-a");
              const barraB = raiz.querySelector(".barra-b");
              const rotA = raiz.querySelector(".rot-a");
              const rotB = raiz.querySelector(".rot-b");
              const t1 = t;
              const dCic = 2.2;
              add((l) => {
                impl.style.opacity = String(outCubic(faixa(l, s + 0.5, 0.5)));
                impl.style.transform = "";
                pilar.style.opacity = "0";
                rotA.style.opacity = String(outCubic(faixa(l, s + 0.2, 0.5)));
                rotB.style.opacity = String(outCubic(faixa(l, s + 0.3, 0.5)));
                risca(barraA, faixa(l, t1, dCic));
                perto.forEach((p, k) => {
                  const tp = t1 + (k / perto.length) * dCic;
                  p.el.style.opacity = String(outCubic(faixa(l, tp, 0.3)));
                });
                risca(barraB, outCubic(faixa(l, t1 + dCic + 0.05, 0.45)));
                const pp = outCubic(faixa(l, t1 + dCic + 0.1, 0.25));
                pilar.style.opacity = String(pp);
                const pc = faixa(l, t1 + dCic + 0.3, 0.5);
                coroa.style.opacity = String(c01(pc * 3));
                coroa.style.transform = `translateY(${String(-120 * (1 - outBack(pc)))}px)`;
                const pa = faixa(l, t1 + dCic + 0.8, 0.7);
                anelC.style.opacity = String(pa > 0 && pa < 1 ? 0.75 * (1 - pa) : 0);
                anelC.style.transform = `scale(${String(0.92 + 0.36 * outCubic(pa))})`;
              });
              ev(t1, "graos", { dur: dCic });
              ev(t1 + dCic + 0.78, "encaixe");
              return t1 + dCic + 1.2;
            },
          };
        },

        /* Enxerto: falta osso na crista; os grãos caem e preenchem até o
           contorno ideal, o contorno fecha, e só então o implante entra. */
        enxerto: (o) => {
          const cfg = { defeito: true };
          const rnd = semeado(29);
          const graos = [];
          for (let y = 312; y < 400; y += 14) {
            for (let x = 338; x < 552; x += 14) {
              const px = x + (rnd() - 0.5) * 6;
              const py = y + (rnd() - 0.5) * 5;
              if (py > profDefeito(px) - 5 || py < 309) continue;
              graos.push({ x: px, y: py, r: 4.6 + rnd() * 2 });
            }
          }
          graos.sort((a, b) => b.y - a.y);
          const miolo = svgImplante(o.id);
          return {
            h: 540,
            svg: `<svg viewBox="0 0 888 540">${svgCorte(cfg, miolo).replace('<g class="graos"></g>', `<g class="graos">${graos.map((g) => `<circle class="fs grao" cx="${g.x.toFixed(1)}" cy="${g.y.toFixed(1)}" r="${g.r.toFixed(1)}"/>`).join("")}</g>`)}</svg>`,
            anima(raiz, add, s, ev) {
              const t = animaCorte(raiz, add, s, ev);
              const ideal = raiz.querySelector(".ideal");
              const idealOk = raiz.querySelector(".ideal-ok");
              const enchido = raiz.querySelector(".enchido");
              const els = [...raiz.querySelectorAll(".grao")];
              const dG = 1.3;
              add((l) => {
                const pi = outCubic(faixa(l, t - 0.2, 0.4));
                const troca = outCubic(faixa(l, t + dG + 0.1, 0.4));
                ideal.style.opacity = String(pi * (1 - troca));
                risca(idealOk, troca);
                els.forEach((g, k) => {
                  const tg = t + 0.1 + (k / els.length) * dG;
                  const p = faixa(l, tg, 0.3);
                  g.style.opacity = String(c01(p * 3) * (1 - 0.45 * troca));
                  g.style.transform = `translateY(${String(-70 * (1 - outCubic(p)))}px)`;
                });
                enchido.style.opacity = String(troca);
              });
              ev(t + 0.1, "graos", { dur: dG });
              ev(t + dG + 0.15, "tick");
              return animaImplante(raiz, add, t + dG + 0.55, ev, true) + 0.3;
            },
          };
        },

        /* Exame de imagem: o feixe varre o corte de cima a baixo e revela a
           imagem, as medidas se desenham e o implante aparece PLANEJADO, em
           tracejado — é a resposta antes da cirurgia. */
        tomografia: (o) => {
          const cfg = { estatico: true };
          return {
            h: o.h ?? 470,
            svg: `<svg viewBox="0 0 888 560">
              <defs><clipPath id="varre-${o.id}"><rect class="janela-v" x="24" y="10" width="840" height="0"/></clipPath></defs>
              <rect class="t2" x="24" y="10" width="840" height="540" rx="34"/>
              <g clip-path="url(#varre-${o.id})">
                <g class="grade">${Array.from({ length: 17 }, (_, k) => `<path class="t3" d="M ${String(24 + k * 52)} 10 L ${String(24 + k * 52)} 550"/>`).join("")}${Array.from({ length: 11 }, (_, k) => `<path class="t3" d="M 24 ${String(10 + k * 54)} L 864 ${String(10 + k * 54)}"/>`).join("")}</g>
                <g transform="translate(44 30) scale(0.9)">${svgCorte(cfg)}
                  <path class="t d med" pathLength="1" d="M 444 306 L 444 486"/>
                  <path class="t d med" pathLength="1" d="M 426 306 L 462 306 M 426 486 L 462 486"/>
                  <path class="t d med" pathLength="1" d="M 318 346 L 570 346"/>
                  <path class="t d med" pathLength="1" d="M 318 330 L 318 362 M 570 330 L 570 362"/>
                  <path class="tr plano" d="${G.implante}"/>
                </g>
              </g>
              <g class="feixe"><rect class="fg" x="24" y="-70" width="840" height="70"/><path class="t" d="M 24 0 L 864 0"/></g></svg>`,
            anima(raiz, add, s, ev) {
              const jan = raiz.querySelector(".janela-v");
              const feixe = raiz.querySelector(".feixe");
              const med = [...raiz.querySelectorAll(".med")];
              const plano = raiz.querySelector(".plano");
              const dV = 1.25;
              add((l) => {
                const p = inOutCubic(faixa(l, s + 0.15, dV));
                const y = 10 + 540 * p;
                jan.setAttribute("height", String(540 * p));
                feixe.style.transform = `translateY(${String(y)}px)`;
                feixe.style.opacity = String(p > 0 && p < 1 ? 1 : 0);
                med.forEach((m, k) => risca(m, outCubic(faixa(l, s + dV + 0.3 + k * 0.18, 0.45))));
                const pp = faixa(l, s + dV + 1.1, 0.5);
                plano.style.opacity = String(outCubic(pp));
                plano.style.strokeDashoffset = String(-40 * pp);
              });
              ev(s + 0.15, "varre", { dur: dV });
              ev(s + dV + 0.3, "risco");
              ev(s + dV + 1.1, "tick");
              return s + dV + 1.7;
            },
          };
        },

        /* Protocolo: a arcada vista de cima, quatro pontos de implante, e a
           prótese inteira assentando sobre eles, dente a dente. */
        protocolo: (o) => {
          const centro = linhaDe(arcoPontos(300, 70, 400));
          const fora = linhaDe(arcoPontos(360, 10, 460));
          const dentro = linhaDe(arcoPontos(240, 130, 340));
          const nD = 12;
          /* A prótese tem dentes mais parelhos que uma arcada natural — mas
             parelhos não é idênticos. A primeira versão dava a todos 62 px de
             altura e 19 de raio, e doze cápsulas iguais em fila leem como
             marshmallow, não como dentes. O feitio vem do vocabulário comum
             (ver `FEITIO_DENTE`), num tamanho um pouco menor porque aqui eles
             dividem o quadro com a barra e os pinos. */
          const feitiosP = Array.from({ length: nD }, (_, k) =>
            feitioDente(k < nD / 2 ? nD / 2 - 1 - k : k - nD / 2, 0.92),
          );
          const dentes = distribuirNoArco(feitiosP, noArco, 1.62).map(
            ({ x, y, f, graus }) =>
              `<g class="dente-b" style="transform-box:fill-box;transform-origin:50% 50%">${svgDenteArco(x, y, graus, f)}</g>`,
          );
          const pinos = [-1.25, -0.42, 0.42, 1.25].map((th) => {
            const [x, y] = noArco(th);
            return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="pino-i centro"><circle class="ft" r="19"/><circle class="t2" r="19"/><circle class="rosca" r="7" style="stroke-width:4"/></g></g>`;
          });
          return {
            h: 540,
            svg: `<svg viewBox="0 0 888 540">
              <path class="fg banda" d="${centro}" style="fill:none;stroke:var(--gg);stroke-width:118;stroke-linecap:round"/>
              <path class="t d fora" pathLength="1" d="${fora}"/>
              <path class="t d dentro" pathLength="1" d="${dentro}"/>
              <path class="ponte" d="${centro}" style="fill:none;stroke:var(--gs);stroke-width:30;stroke-linecap:round;opacity:0"/>
              ${pinos.join("")}${dentes.join("")}</svg>`,
            anima(raiz, add, s, ev) {
              const banda = raiz.querySelector(".banda");
              const fora = raiz.querySelector(".fora");
              const dentro = raiz.querySelector(".dentro");
              const ponte = raiz.querySelector(".ponte");
              const pinos = [...raiz.querySelectorAll(".pino-i")];
              const dentes = [...raiz.querySelectorAll(".dente-b")];
              const tp = s + 0.85;
              const td = tp + 0.75;
              add((l) => {
                risca(fora, outCubic(faixa(l, s, 0.8)));
                risca(dentro, outCubic(faixa(l, s + 0.1, 0.8)));
                banda.style.opacity = String(outCubic(faixa(l, s + 0.3, 0.6)));
                pinos.forEach((p, k) => {
                  const q = faixa(l, tp + k * 0.13, 0.4);
                  p.style.opacity = String(c01(q * 3));
                  p.style.transform = `scale(${String(Math.max(0, outBack(q)))})`;
                });
                ponte.style.opacity = String(0.3 * outCubic(faixa(l, td - 0.1, 0.4)));
                dentes.forEach((d, k) => {
                  const q = faixa(l, td + k * 0.055, 0.42);
                  d.style.opacity = String(c01(q * 2.5));
                  d.style.transform = `scale(${String(1.35 - 0.35 * outCubic(q))})`;
                });
              });
              ev(s, "risco");
              pinos.forEach((_, k) => ev(tp + k * 0.13 + 0.15, "pop"));
              ev(td + 0.1, "graos", { dur: nD * 0.055 });
              ev(td + nD * 0.055 + 0.35, "encaixe");
              return td + nD * 0.055 + 0.6;
            },
          };
        },

        /* Plano: a grade se desenha, o dente aparece como projeto (traço
           fino), as cotas se medem, e o projeto vira dente — com o visto. */
        plano: (o) => {
          const dente =
            "M 330 250 C 318 190, 312 116, 342 84 C 372 52, 516 52, 546 84 C 576 116, 570 190, 558 250 C 548 330, 520 420, 468 478 C 456 490, 432 490, 420 478 C 368 420, 340 330, 330 250 Z";
          return {
            h: 520,
            svg: `<svg viewBox="0 0 888 520">
              <g class="grade">${Array.from({ length: 17 }, (_, k) => `<path class="t3 d" pathLength="1" d="M ${String(60 + k * 48)} 10 L ${String(60 + k * 48)} 510"/>`).join("")}${Array.from({ length: 11 }, (_, k) => `<path class="t3 d" pathLength="1" d="M 36 ${String(20 + k * 48)} L 852 ${String(20 + k * 48)}"/>`).join("")}</g>
              <path class="t2 d projeto" pathLength="1" d="${dente}"/>
              <path class="fs feito" d="${dente}" style="opacity:0"/>
              <path class="t d feito-l" pathLength="1" d="${dente}"/>
              <path class="t2 d cota" pathLength="1" d="M 330 22 L 558 22 M 330 8 L 330 36 M 558 8 L 558 36"/>
              <path class="t2 d cota" pathLength="1" d="M 640 52 L 640 488 M 626 52 L 654 52 M 626 488 L 654 488"/>
              <g transform="translate(700 120)"><g class="visto centro"><circle r="40" style="fill:#56A805"/><path d="M -17 1 L -5 13 L 18 -12" style="fill:none;stroke:#032F01;stroke-width:8;stroke-linecap:round;stroke-linejoin:round"/></g></g></svg>`,
            anima(raiz, add, s, ev) {
              const grade = [...raiz.querySelectorAll(".grade path")];
              const projeto = raiz.querySelector(".projeto");
              const feito = raiz.querySelector(".feito");
              const feitoL = raiz.querySelector(".feito-l");
              const cotas = [...raiz.querySelectorAll(".cota")];
              const visto = raiz.querySelector(".visto");
              add((l) => {
                grade.forEach((g, k) => risca(g, outCubic(faixa(l, s + k * 0.022, 0.5))));
                risca(projeto, inOutCubic(faixa(l, s + 0.45, 0.9)));
                cotas.forEach((c, k) => risca(c, outCubic(faixa(l, s + 1.2 + k * 0.2, 0.5))));
                const pf = outCubic(faixa(l, s + 1.9, 0.6));
                feito.style.opacity = String(pf);
                risca(feitoL, pf);
                projeto.style.opacity = String(1 - pf);
                const pv = faixa(l, s + 2.35, 0.45);
                visto.style.opacity = String(c01(pv * 3));
                visto.style.transform = `scale(${String(Math.max(0, outBack(pv)))})`;
              });
              ev(s, "risco");
              ev(s + 1.2, "risco");
              ev(s + 1.95, "encaixe");
              ev(s + 2.4, "pop");
              return s + 2.9;
            },
          };
        },

        /* Clareamento: o dente em corte — esmalte, dentina, polpa. A luz

        esmalte: (o) => {

          const juncao =

          const polpa =

              const ini = [227, 209, 156];

              add((l) => {

                esm.style.opacity = String(outCubic(faixa(l, s + 0.6, 0.5)));
                dentina.style.opacity = String(outCubic(faixa(l, s + 0.8, 0.5)));
                polpa.style.opacity = String(outCubic(faixa(l, s + 1.0, 0.5)));
                risca(juncao, outCubic(faixa(l, s + 0.9, 0.6)));

        /* Linha do tempo: 2002 em Pirituba, a mudança, e a seta até hoje. */
        "linha-do-tempo": (o) => {
          const [m1, m2] = o.marcos;
          return {
            h: 330,
            svg: `<svg viewBox="0 0 888 330">
              <path class="t2 d linha" pathLength="1" d="M 50 170 L 836 170" style="stroke-width:5"/>
              <path class="t d seta" pathLength="1" d="M 812 152 L 838 170 L 812 188"/>
              <text class="tx hoje" x="836" y="130" text-anchor="end">HOJE</text>
              ${[
                [130, m1],
                [610, m2],
              ]
                .map(
                  ([x, m]) =>
                    `<g class="marco"><g transform="translate(${String(x)} 170)"><circle class="centro bola" r="21" style="fill:#56A805"/></g><text class="ano" x="${String(x)}" y="120" text-anchor="middle">${e(m[0])}</text><text class="tx" x="${String(x)}" y="240" text-anchor="middle">${e(String(m[1]).toUpperCase())}</text></g>`,

            anima(raiz, add, s, ev) {

                marcos.forEach((m, k) => {
                  const tk = s + dL * (k === 0 ? 0.08 : 0.72);
                  const bola = m.querySelector(".bola");
                  const q = faixa(l, tk, 0.4);
                  bola.style.opacity = String(c01(q * 3));
                  bola.style.transform = `scale(${String(Math.max(0, outBack(q)))})`;
                  const [ano, lugar] = m.querySelectorAll("text");
                  const pa = outCubic(faixa(l, tk + 0.1, 0.5));
                  ano.style.opacity = String(pa);
                  ano.style.transform = `translateY(${String(26 * (1 - pa))}px)`;
                  lugar.style.opacity = String(outCubic(faixa(l, tk + 0.25, 0.5)));

              ev(s, "risco");
              ev(s + dL * 0.08, "pop");
              ev(s + dL * 0.72, "pop");

        /* Depoimento: a aspa assenta, e as cinco estrelas do Google enchem. */
        aspas: (o) => {

            `<g transform="translate(${String(330 + k * 92)} 40) scale(3.2)"><path d="${ESTRELA}" style="fill:var(--gl3)"/><path class="est" d="${ESTRELA}" style="fill:#56A805"/></g>`;

            anima(raiz, add, s, ev) {
              const aspa = raiz.querySelector(".aspa");
              const ests = [...raiz.querySelectorAll(".est")];
              const fonte = raiz.querySelector(".fonte");
              add((l) => {
                const q = faixa(l, s, 0.5);
                aspa.style.opacity = String(c01(q * 3));
                aspa.style.transform = `scale(${String(0.6 + 0.4 * outBack(q))})`;
                ests.forEach((st, k) => {
                  const pk = faixa(l, s + 0.3 + k * 0.1, 0.35);
                  st.style.opacity = String(c01(pk * 2));
                  st.style.transformBox = "fill-box";
                  st.style.transformOrigin = "50% 50%";
                  st.style.transform = `scale(${String(Math.max(0, outBack(pk)))})`;
                });
                fonte.style.opacity = String(outCubic(faixa(l, s + 0.8, 0.5)));
