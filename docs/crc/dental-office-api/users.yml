  patch:
    tags:
      - Usuários
    summary: Alterar Usuário
    description: Atualiza os atributos de usuário, somente necessário enviar os parâmetros alterados.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  name:
                    type: string
                    description: Nome do usuário
                  email:
                    type: string
                    description: E-mail do usuário
                  user_group_id:
                    type: integer
                    description: Grupo de usuários
                  clinic_ids:
                    type: array
                    items:
                      type: integer
                    description: Identificador das clínicas
                  addresses_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Identificador do endereço
                        street:
                          type: string
                          description: Rua
                        number:
                          type: string
                          description: Número
                        complement:
                          type: string
                          description: Complemento
                        neighborhood:
                          type: string
                          description: Bairro
                        city:
                          type: string
                          description: Cidade
                        state:
                          type: string
                          description: Estado
                        zipcode:
                          type: string
                          description: CEP
                    description: Atributos de endereço
                  contacts_attributes:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Identificador do contato
                      phone:
                        type: string
                        description: Telefone residencial
                      fax:
                        type: string
                        description: Telefone comercial
                      cellphone:
                        type: string
                        description: Celular
                    description: Atributos de contato
          example:
            user:
              name: Usuário Adm
              contacts_attributes:
                id: 2
                cellphone: (88)88888-8888
    security:
      - bearerAuth: []
    responses:
      "204":
        description: No Content
        content:
          text/plain:
            schema:
              type: string
            example: null
  delete:
    tags:
      - Usuários
    summary: Remover Usuário
    description: Exclui o usuário indicado.
    security:
      - bearerAuth: []
    responses:
      "204":
        description: No Content
        content:
          text/plain:
            schema:
              type: string
            example: null
  parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
      example: "1"
