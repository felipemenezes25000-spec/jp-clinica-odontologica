  post:
    tags:
      - Dentistas
    summary: Criar Dentista
    description: Cria um novo dentista.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              dentist:
                type: object
                properties:
                  name:
                    type: string
                    description: Nome
                  speciality_ids:
                    type: array
                    items:
                      type: integer
                    description: Identificadores de especialidade
                  duration:
                    type: integer
                    description: Duração das consultas em minutos
                  birth_date:
                    type: string
                    format: date
                    description: Data de nascimento
                  rg:
                    type: string
                    description: Número do RG
                  cpf:
                    type: string
                    description: Número do CPF
                  cr_type:
                    type: string
                    description: Sigla do conselho
                  cr_number:
                    type: string
                    description: Número do conselho
                  cr_uf:
                    type: string
                    description: UF do conselho
                  commission_type:
                    type: integer
                    description: 0 - Fixo, 1 - Por procedimento
                  commission_percent:
                    type: number
                    description: Porcentagem do comissionamento
                  commission_prosthetic:
                    type: integer
                    description: "Abatimento protético: 0 - Não, 1 - Sim"
                  commission_prosthetic_percent:
                    type: number
                    description: Porcentagem do abatimento protético
                  gender:
                    type: integer
                    description: 0 - masculino, 1 - feminino
                  user_id:
                    type: integer
                    description: Identificador de usuário
                  clinic_ids:
                    type: array
                    items:
                      type: integer
                    description: Identificadores das clínicas
                  chair_ids:
                    type: array
                    items:
                      type: integer
                    description: Identificadores das cadeiras
                  dentist_type:
                    type: string
                    description: Por padrão é 'dentist', podendo ser 'student' ou 'teacher'
                  semester:
                    type: integer
                    description: Semestre - utilizado em Clínica Escola
                  addresses_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        street:
                          type: string
                          description: Rua
                        number:
                          type: string
                          description: Número
                        complement:
                          type: string
                          description: Complemento
                        neighborhood:
                          type: string
                          description: Bairro
                        city:
                          type: string
                          description: Cidade
                        state:
                          type: string
                          description: Estado
                        zipcode:
                          type: string
                          description: CEP
                    description: Atributos do endereço
                  contacts_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        phone:
                          type: string
                          description: Telefone residencial
                        email:
                          type: string
                          description: E-mail
                        cellphone:
                          type: string
                          description: Celular
                    description: Atributos do contato
                required:
                  - name
          example:
            dentist:
              name: Dentista Clínica Escola
              duration: 30
              chair_ids:
                - 1
              dentist_type: teacher
              contacts_attributes:
                - cellphone: (77)77777-7777
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
