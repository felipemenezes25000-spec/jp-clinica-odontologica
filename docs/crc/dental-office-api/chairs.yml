clinics/{clinic_id}/chairs:
  get:
    tags:
      - Cadeiras
    summary: Listar Cadeiras
    description: Recupera uma lista de cadeiras associadas a uma clínica específica.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            examples:
              example-0:
                summary: 200 - OK
                value:
                  total_pages: 1
                  count: 1
                  from: 1
                  to: 1
                  current_page: 1
                  results:
                    - id: 1
                      name: Cadeira Principal
                      created_at: "2023-05-22T22:37:46.000Z"
                      updated_at: "2023-05-22T22:37:46.000Z"
                      deleted_at: null
              example-1:
                summary: 200 - OK Filtered
                value:
                  total_pages: 1
                  count: 1
                  from: 1
                  to: 1
                  current_page: 1
                  results:
                    - id: 4
                      name: "Nova Cadeira - Restaurado em: 02/02/2024 às 17:37"
                      created_at: "2024-02-02T17:34:50.000Z"
                      updated_at: "2024-02-02T17:39:48.000Z"
                      deleted_at: "2024-02-02T17:39:48.000Z"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              type: object
            example:
              errors:
                "Erro:":
                  - Registro não encontrado.
  post:
    tags:
      - Cadeiras
    summary: Criar uma Cadeira
    description: Cria uma nova cadeira na clínica.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              chair:
                type: object
                properties:
                  name:
                    type: string
          example:
            chair:
              name: Nova Cadeira II
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              id: 4
              clinic_id: 1
              name: Nova Cadeira
              created_at: "2024-02-02T17:34:50.392Z"
              updated_at: "2024-02-02T17:34:50.392Z"
              deleted_at: null
      "422":
        description: Unprocessable Entity (WebDAV) (RFC 4918)
        content:
          application/json:
            schema:
              type: object
            example:
              errors:
                name:
                  - Nome já está em uso
  parameters:
    - name: clinic_id
      in: path
      schema:
        type: integer
      required: true
      description: "Referência da clínica"
      example: "1"
clinics/{clinic_id}/chairs/{id}:
  get:
    tags:
      - Cadeiras
    summary: Detalhes da Cadeira
    description: Retorna os detalhes de uma cadeira específica.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              id: 1
              name: Cadeira Principal
              created_at: "2023-05-22T22:37:46.000Z"
              updated_at: "2023-05-22T22:37:46.000Z"
              deleted_at: null
              clinic:
                id: 1
                name: Maini
              disciplines: []
  put:
    tags:
      - Cadeiras
    summary: Atualizar Cadeira
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              chair:
                type: object
                properties:
                  name:
                    type: string
                    description: Nome da cadeira
                required:
                  - name
          example:
            chair:
              name: Cadeira Atualizada
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              id: 3
              clinic_id: 1
              name: Cadeira Atualizada
              created_at: "2024-02-02T17:16:35.000Z"
              updated_at: "2024-02-02T17:30:30.000Z"
              deleted_at: null
    description: Atualiza os dados de uma cadeira.
  delete:
    tags:
      - Cadeiras
    summary: Remover uma Cadeira
    security:
      - bearerAuth: []
    responses:
      "204":
        description: No Content
        content:
          text/plain:
            schema:
              type: string
            example: null
    description: Remove uma cadeira da clínica.
  parameters:
    - name: clinic_id
      in: path
      schema:
        type: integer
      required: true
      description: Referência da Clínica
      example: "1"
    - name: id
      in: path
      schema:
        type: integer
      required: true
      description: Referência da Cadeira
      example: "1"
clinics/{clinic_id}/chairs/restore:
  put:
    tags:
      - Cadeiras
    summary: Restaurar uma Cadeira
    description: Restaura uma cadeira e consequentemente restaura todos os agendamentos que estavam a serem realizados nela.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: query
        schema:
          type: integer
        description: Referencia da Cadeira
        example: "3"
    responses:
      "204":
        description: No Content
        content:
          text/plain:
            schema:
              type: string
            example: null
  parameters:
    - name: clinic_id
      in: path
      schema:
        type: integer
      required: true
      description: Referência da Clínica
      example: "1"
clinics/{clinic_id}/chairs/work_schedules:
  get:
    tags:
      - Cadeiras
    summary: Checkar Escala de Dentistas
    description: Retorna os horários de atendimento em uma cadeira e qual dentista está alocado.
    security:
      - bearerAuth: []
    parameters:
      - name: dentist_id
        in: query
        schema:
          type: integer
        description: Filtra apenas por um dentista que tenha horários configurados para a cadeira
        example: "7"
      - name: exclude_dentist_id
        in: query
        schema:
          type: integer
        description:
          Remove do filtro um dentista caso a cadeira tenha mais de um dentista com horários configurados para a
          cadeira
        example: "1"
      - name: id
        in: query
        schema:
          type: integer
        description: Referência da cadeira para buscar horários
        example: "1"
