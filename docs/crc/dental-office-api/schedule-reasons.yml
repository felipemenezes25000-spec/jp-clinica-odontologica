schedule_reasons:
  get:
    tags:
    - Motivos do Agendamento
    summary: Listar
    description: Lista os motivos de agendamento.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
            - id: 5
              name: Brasil
              deleted_at: null
              created_at: '2025-03-07T19:59:50.000Z'
              updated_at: '2025-03-07T19:59:50.000Z'
            - id: 2
              name: Cirurgia
              deleted_at: null
              created_at: '2025-03-07T19:32:51.000Z'
              updated_at: '2025-03-07T19:32:51.000Z'
            - id: 4
              name: Itau
              deleted_at: null
              created_at: '2025-03-07T19:49:20.000Z'
              updated_at: '2025-03-07T19:49:20.000Z'
            - id: 3
              name: Profilaxia
              deleted_at: null
              created_at: '2025-03-07T19:32:51.000Z'
              updated_at: '2025-03-07T19:32:51.000Z'
    parameters:
    - name: q
      in: query
      schema:
        type: string
      description: Filtro por nome do motivo de agendamento
    - name: page
      in: query
      schema:
        type: integer
      description: Número da página para paginação
    - name: per_page
      in: query
      schema:
        type: integer
      description: Quantidade de itens por página
  post:
    tags:
    - Motivos do Agendamento
    summary: Cadastrar
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              schedule_reason:
                type: object
                properties:
                  name:
                    type: string
          example:
            schedule_reason:
              name: Itau
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
            example:
              id: 6
              name: Banco do Brasil
              deleted_at: null
              created_at: '2025-03-11T13:41:31.164Z'
              updated_at: '2025-03-11T13:41:31.164Z'
      '422':
        description: Unprocessable Entity (WebDAV) (RFC 4918)
        content:
          application/json:
            schema:
              type: object
            example:
              errors:
              - Nome já está em uso.
schedule_reasons/{id}:
  get:
    tags:
    - Motivos do Agendamento
    summary: Show
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              id: 6
              name: Bradesco
              deleted_at: null
              created_at: '2025-03-11T13:41:31.000Z'
              updated_at: '2025-03-11T13:41:46.000Z'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              type: object
            example:
              error: Schedule reason not found
  put:
    tags:
    - Motivos do Agendamento
    summary: Alterar
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              schedule_reason:
                type: object
                properties:
                  name:
                    type: string
          example:
            schedule_reason:
              name: Bradesco
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              id: 8
              name: Bradesco
              deleted_at: null
              created_at: '2025-03-11T15:01:39.000Z'
              updated_at: '2025-03-11T15:01:39.000Z'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              type: object
            example:
              error: Schedule reason not found
  delete:
    tags:
    - Motivos do Agendamento
    summary: Remover
    responses:
      '204':
        description: No Content
        content:
          text/plain:
            schema:
              type: string
            example: null
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: ID do recurso
