customers:
  get:
    tags:
      - Pacientes
    summary: Pacientes Cadastrados
    description: Lista os pacientes de acordo com a busca. Sem o envio de parâmetro, lista todos os pacientes ativos cadastrados.
    security:
      - bearerAuth: []
    parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Nome do paciente para busca
      - name: page
        in: query
        schema:
          type: integer
        description: Página da listagem
      - name: clinic_id
        in: query
        schema:
          type: integer
        description: Identificador da clínica
      - name: only_deleted
        in: query
        schema:
          type: boolean
        description: Por padrão retorna todos os pacientes deletados
      - name: deleted_start_date
        in: query
        schema:
          type: string
          format: date
        description: Filtra o começo da data de exclusão
      - name: deleted_end_date
        in: query
        schema:
          type: string
          format: date
        description: Filtra o limite da data de exclusão
      - name: active
        in: query
        schema:
          type: string
        description: "true: ativos, false: inativos, both: todos"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
            example:
              total_pages: 1
              count: 1
              from: 1
              to: 1
              current_page: 1
