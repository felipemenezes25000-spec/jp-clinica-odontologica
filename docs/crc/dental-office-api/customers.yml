  post:
    tags:
      - Pacientes
    summary: Criar Paciente
    description: Cria um novo paciente.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              customer:
                type: object
                properties:
                  title:
                    type: string
                    description: Identificação
                  name:
                    type: string
                    description: Nome do paciente
                  obs:
                    type: string
                    description: Observações
                  clinic_id:
                    type: integer
                    description: Identificador da clínica
                  record_number:
                    type: string
                    description: Se não enviado, a API irá adicionar o próximo número sequencial
                  record_date:
                    type: string
                    format: date
                    description: Se não enviado, será adicionado o dia do cadastro
                  dentist_id:
                    type: integer
                    description: Identificador do dentista responsável
                  gender:
                    type: integer
                    description: 0 - masculino, 1 - feminino
                  photo:
                    type: string
                    description: Imagem em base 64
                  birth_date:
                    type: string
                    format: date
                    description: Data de nascimento
                  birth_place:
                    type: string
                    description: Local de nascimento
                  marital_status:
                    type: integer
                    description: 0 - Solteiro(a), 1 - Casado(a), 2 - Viúvo(a), 3 - Divorciado(a), 4 - Desquitado(a)
                  customer_group_id:
                    type: integer
                    description: 1 - Definitivo, 2 - Pré-Tratamento, 3 - Excluído
                  customer_situation_id:
                    type: integer
                    description: Identificador da situação do paciente
                  specialty_ids:
                    type: array
                    items:
                      type: integer
                    description: Identificadores das especialidades
                  is_holder:
                    type: boolean
                    description: true se for titular, false se não for
                  father_name:
                    type: string
                    description: Nome do pai
                  father_rg:
                    type: string
                    description: RG do pai
                  father_cpf:
                    type: string
                    description: CPF do pai
                  father_phone:
                    type: string
                    description: Telefone do pai
                  mother_name:
                    type: string
                    description: Nome da mãe
                  mother_rg:
                    type: string
                    description: RG da mãe
                  mother_cpf:
                    type: string
                    description: CPF da mãe
                  mother_phone:
                    type: string
                    description: Telefone da mãe
                  document_attributes:
                    type: object
                    properties:
                      cpf:
                        type: string
                        description: CPF
                      rg:
                        type: string
                        description: Registro Geral
                      emitter:
                        type: string
                        description: Órgão emissor
                      dental_insurance_id:
                        type: integer
                        description: Identificador do Convenio (1 - Particular, 2 - Tabela Tuss)
                      plan_id:
                        type: integer
                        description: Identificador do plano
                      accession_date:
                        type: string
                        format: date
                        description: Data de adesão
                      card_number:
                        type: string
                        description: Número de carteirinha
                      card_validate:
                        type: string
                        format: date
                        description: Validade de carteirinha
                      cns_number:
                        type: string
                        description: Número do CNS
                    description: Atributos de documentos
                  addresses_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        street:
                          type: string
                          description: Rua
                        number:
                          type: string
                          description: Número
                        complement:
                          type: string
                          description: Complemento
                        neighborhood:
                          type: string
                          description: Bairro
                        city:
                          type: string
                          description: Cidade
                        state:
                          type: string
                          description: Estado
                        zipcode:
                          type: string
                          description: CEP
                    description: Atributos de endereço
                  contacts_attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        phone:
                          type: string
                          description: Telefone residencial
                        fax:
                          type: string
                          description: Telefone comercial
                        cellphone:
                          type: string
                          description: Celular
                        message_phone:
                          type: string
                          description: Telefone para recado
                        message_contact:
                          type: string
                          description: Nome para contato
                        email:
                          type: string
                          description: E-mail
                    description: Atributos de contato
                required:
                  - name
                  - clinic_id
          example:
            customer:
              name: Max Cavalera
              record_date: "2023-01-30"
              record_number: 3213
              contacts_attributes:
                - email: max@cavalera.com
                  phone: "1140028922"
                  cellphone: "1140028922"
              addresses_attributes:
                - street: Rua x
                  number: "1"
