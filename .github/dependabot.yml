# ============================================================================
#  Atualização de dependência CONTROLADA, e não automática.
#
#  O Dependabot abre PR; ele não mescla. Cada PR passa pelos mesmos portões
#  que qualquer outra mudança — lint, typecheck, 1.900 testes, build,
#  integração contra Postgres e a varredura do bundle.
#
#  POR QUE AGRUPAR EM VEZ DE UM PR POR PACOTE: trinta PRs por semana é o mesmo
#  que zero. Ninguém revisa, alguém mescla no escuro, e a proteção vira
#  cerimônia. Agrupado, são dois ou três PRs revisáveis.
#
#  MAJOR FICA DE FORA DO GRUPO. Uma major é uma decisão, não uma manutenção —
#  ela vem sozinha, com o changelog na mão.
# ============================================================================
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      producao:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      # Correção de segurança anda junta e na frente: o agrupamento por
      # severidade evita que um patch de CVE fique atrás de um bump de tipo.
      seguranca:
        applies-to: security-updates
        patterns: ["*"]

  # As próprias ações do CI são dependência, e são as que rodam com o token do
  # repositório. Esquecê-las é deixar de fora justamente o elo mais sensível.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    groups:
      acoes:
        patterns: ["*"]
