name: Optimize Tailwind scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-tailwind-scan.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Limit Tailwind sources to UI files
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/styles.css")
          text = p.read_text()
          old = '@source "../src";'
          new = '@source "../src/routes";\n@source "../src/components";'
          if text.count(old) != 1:
              raise SystemExit(f"esperava 1 ocorrência de {old!r}, achei {text.count(old)}")
          p.write_text(text.replace(old, new, 1))

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src vite.config.ts eslint.config.js

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build and report CSS sizes
        shell: bash
        run: |
          npm run build
          echo "--- CSS gerado ---"
          find .vercel/output/static/assets -maxdepth 1 -name '*.css' -printf '%s %f\n' | sort -nr

      - name: Commit optimized scan and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-tailwind-scan.yml
          git add src/styles.css
          git commit -m "perf(css): limita Tailwind aos arquivos de interface"
          git push origin HEAD:main
