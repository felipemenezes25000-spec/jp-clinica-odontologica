name: CRC Format Once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: crc-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format CRC and existing site formatting debt
        run: >-
          npx prettier --write
          "src/components/crc/**/*.{ts,tsx}"
          src/routes/crc.tsx
          src/components/site/ContactForm.tsx
          src/components/site/Footer.tsx

      - name: Validate lint
        run: npx eslint src vite.config.ts eslint.config.js

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/crc src/routes/crc.tsx src/components/site/ContactForm.tsx src/components/site/Footer.tsx
          git commit -m "format CRC redesign"
          git push origin HEAD:main
