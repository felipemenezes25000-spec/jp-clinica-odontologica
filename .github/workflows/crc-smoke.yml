name: CRC Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: crc-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
