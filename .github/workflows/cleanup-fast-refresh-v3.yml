name: Cleanup Fast Refresh v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-fast-refresh-v3.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply refactor
        run: python .github/scripts/cleanup_fast_refresh.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint zero warnings
        run: npx eslint src vite.config.ts eslint.config.js --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-fast-refresh.yml .github/workflows/cleanup-fast-refresh-v2.yml .github/workflows/cleanup-fast-refresh-v3.yml .github/scripts/cleanup_fast_refresh.py
          git add src
          git commit -m "refactor(ui): zera warnings de Fast Refresh"
          git push origin HEAD:main
