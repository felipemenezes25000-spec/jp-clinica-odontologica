name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src vite.config.ts eslint.config.js

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # ----------------------------------------------------------------------
      # O que foi PARAR no navegador
      # ----------------------------------------------------------------------
      #
      # DEPOIS DO BUILD, e não antes: a pergunta e sobre o arquivo que o
      # navegador baixa, e nao sobre o codigo-fonte. O Vite substitui
      # `import.meta.env.X` por um LITERAL em tempo de build — uma variavel
      # renomeada para `VITE_...` viaja para dentro do JavaScript publicado, e
      # nada na tela muda.
      #
      # O script nao imprime o trecho encontrado, so a posicao e o tamanho:
      # log de CI e lido por mais gente e guardado por mais tempo do que
      # qualquer um imagina.
      - name: Nenhum segredo nem modulo de servidor no bundle
        run: node scripts/conferir-bundle.mjs
