name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint src vite.config.ts eslint.config.js

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # ----------------------------------------------------------------------
      # O que foi PARAR no navegador
      # ----------------------------------------------------------------------
      #
      # DEPOIS DO BUILD, e não antes: a pergunta e sobre o arquivo que o
      # navegador baixa, e nao sobre o codigo-fonte. O Vite substitui
      # `import.meta.env.X` por um LITERAL em tempo de build — uma variavel
      # renomeada para `VITE_...` viaja para dentro do JavaScript publicado, e
      # nada na tela muda.
      #
      # O script nao imprime o trecho encontrado, so a posicao e o tamanho:
      # log de CI e lido por mais gente e guardado por mais tempo do que
      # qualquer um imagina.
      - name: Nenhum segredo nem modulo de servidor no bundle
        run: node scripts/conferir-bundle.mjs

      # ----------------------------------------------------------------------
      # O FUNIL DE TRAFEGO PAGO, NO NAVEGADOR
      # ----------------------------------------------------------------------
      #
      # POR ULTIMO, E DEPOIS DO BUILD, por dois motivos tecnicos:
      #
      #   `scripts/servidor-site-e2e.mjs` reconstroi com NITRO_PRESET=node-server
      #   (o preset `vercel` gera funcoes serverless, que `node` nao executa), e
      #   nao faz sentido pagar esse build antes de o build normal ter passado.
      #
      #   E porque tudo o que vem antes e mais barato: um `tsc` quebrado nao
      #   precisa esperar o Chromium baixar para ficar vermelho.
      #
      # O QUE ELE PROTEGE, e a razao de estar aqui e nao so na maquina de quem
      # implementou: o site ja teve uma regressao em que UM clique virava TRES
      # eventos -- um `Contact` e dois `Lead` na Meta -- e outra em que
      # `/implante-dentario`, a rota que a clinica paga para trazer gente, nao
      # disparava `treatment_view`. Nenhuma das duas quebra o build, nenhuma
      # aparece na tela, e as duas custam dinheiro todo dia em que ficam no ar.
      #
      # SEM CREDENCIAL NENHUMA. O servidor deste E2E sobe sem Postgres, sem CRC,
      # sem GTM e sem Pixel -- de proposito: esse e o ambiente que a campanha
      # encontra na primeira fase, e o teste prova que o CTA de WhatsApp funciona
      # nele.
      - name: Navegador do E2E publico
        run: npx playwright install --with-deps chromium

      - name: E2E do trafego pago (sem banco, sem CRC, sem container)
        run: npm run e2e:site

      # O rastro so do que falhou. `if: failure()` porque o relatorio de uma
      # execucao verde e lixo de artefato.
      - name: Relatorio do E2E que falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-publico
          path: |
            playwright-report/
            test-results/
          retention-days: 7
